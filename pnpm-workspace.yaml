minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Exact OpenCode v2 packages reviewed for the engine migration.
  - "@opencode/client@2.1.4"
  - "@opencode/plugin@2.1.4"
  - "@opencode/plugin-browser@2.1.4"
  - "@opencode/schema@2.1.4"
  - "@opencode/protocol@2.1.4"
  - "@opencode/ai@2.1.4"
  - "@opencode/util@2.1.4"
  # Explicitly allow the reviewed Electron security update.
  - "electron@43.8.8"
  # Pinned standalone OpenUI runtime reviewed for the reversible wiki prototype.
  - "@openuidev/react-lang@0.4.1"
  - "@openuidev/lang-core@0.4.1"
  - "@openuidev/react-ui@0.17.1"
  - "@openuidev/react-headless@0.17.1"
  - "@openuidev/devtools@0.2.3"

packages:
  - "apps/*"
  - "packages/*"
  # The Raycast extension is built by Raycast's own tooling; install it inside its folder.
  - "!apps/raycast-legalwork"

catalog:
  react: 19.2.4
  react-dom: 19.2.4

catalogs:
  react18:
    react: 18.2.0
    react-dom: 18.2.0
linkWorkspacePackages: true
preferWorkspacePackages: true
# pnpm 11 re-verifies manifests vs lockfile before every `pnpm run` and
# auto-installs on drift. Release builds intentionally drift: CI stamps the
# tag version into package.json after the frozen-lockfile install
# (scripts/release/apply-version.mjs), which the auto-install then rejects.
# Installs are always explicit here, so skip the pre-run check.
verifyDepsBeforeRun: false
allowBuilds:
  # The published runtime is prebuilt; its postinstall only sends telemetry.
  "@openuidev/lang-core": false
  cpu-features: false
  # Optional msgpackr native accelerator; the bundled SDK uses the JavaScript fallback.
  msgpackr-extract: false
  ssh2: false
  better-sqlite3: true
  core-js: false
  electron: true
  esbuild: true
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true
  # CPU binaries already ship in the package; do not download optional CUDA libraries.
  onnxruntime-node: false
  # Windows releases use NSIS, not the optional Squirrel installer.
  electron-winstaller: false
# Keep security fixes when transitive dependencies pin an older version.
overrides:
  'proxy-addr@<2.0.8': 2.0.8
  'seroval@<1.6.2': 1.6.2
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  '@xmldom/xmldom@>=0.8.0 <0.8.15': 0.8.15
patchedDependencies:
  '@eigenpal/docx-editor-agents@1.8.3': patches/@eigenpal__docx-editor-agents@1.8.3.patch
  '@eigenpal/docx-editor-core@1.8.3': patches/@eigenpal__docx-editor-core@1.8.3.patch
  '@eigenpal/docx-editor-react@1.8.3': patches/@eigenpal__docx-editor-react@1.8.3.patch
  electron-updater@6.8.3: patches/electron-updater@6.8.3.patch
  pptx-react-viewer@3.5.4: patches/pptx-react-viewer@3.5.4.patch
  smb3-client@0.2.0: patches/smb3-client@0.2.0.patch
