minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@opencode-ai/sdk"
  # Explicitly allow the reviewed Electron security update.
  - "electron@43.7.5"

packages:
  - "apps/*"
  - "packages/*"

catalog:
  react: 19.2.4
  react-dom: 19.2.4

catalogs:
  react18:
    react: 18.2.0
    react-dom: 18.2.0
linkWorkspacePackages: true
preferWorkspacePackages: true
# pnpm 11 re-verifies manifests vs lockfile before every `pnpm run` and
# auto-installs on drift. Release builds intentionally drift: CI stamps the
# tag version into package.json after the frozen-lockfile install
# (scripts/release/apply-version.mjs), which the auto-install then rejects.
# Installs are always explicit here, so skip the pre-run check.
verifyDepsBeforeRun: false
allowBuilds:
  cpu-features: false
  ssh2: false
  "@whiskeysockets/baileys": true
  better-sqlite3: true
  core-js: false
  electron: true
  esbuild: true
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true
  # CPU binaries already ship in the package; do not download optional CUDA libraries.
  onnxruntime-node: false
  # Windows releases use NSIS, not the optional Squirrel installer.
  electron-winstaller: false
# Keep document parsers patched even when a transitive dependency pins an older patch.
overrides:
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  '@xmldom/xmldom@>=0.8.0 <0.8.15': 0.8.15
patchedDependencies:
  '@eigenpal/docx-editor-core@1.8.3': patches/@eigenpal__docx-editor-core@1.8.3.patch
  '@eigenpal/docx-editor-react@1.8.3': patches/@eigenpal__docx-editor-react@1.8.3.patch
  pptx-react-viewer@3.5.4: patches/pptx-react-viewer@3.5.4.patch
  smb3-client@0.2.0: patches/smb3-client@0.2.0.patch
