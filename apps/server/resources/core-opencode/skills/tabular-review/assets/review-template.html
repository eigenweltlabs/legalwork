<!doctype html>
<!--
  tabular-review artifact template — Eigenwelt "Deep Current" theme, with an embedded
  pdf.js viewer that loads each source PDF DYNAMICALLY from the local file (nothing is
  embedded, so the artifact stays small no matter how many/large the PDFs).

  The builder (assets/build-review.mjs) fills three comment tokens (placed below in the
  pdfjs script, the pdf-worker script, and the review-data script): the pdf.js library
  (executes, defines window.pdfjsLib), the raw pdf.worker source (decoded to a Blob
  worker), and the review JSON. Do not hand-edit those; run the builder.

  How the viewer gets PDF bytes (in priority order):
    1. row.fileUrl set            -> fetch that URL directly (standalone / testing)
    2. running inside the app     -> postMessage {type:'legalwork:pdf-request', path:row.file}
                                     to the parent; the app replies with the file bytes
    3. opened standalone (top)    -> fetch row.file as a relative URL
  Each cell provides `quote` (the exact sentence to highlight) and `page` (jump hint).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Document Review</title>
<style>
  :root {
    --ink:#0E0A07; --paper:#FEFEFE; --sunken:#F3F5F8;
    --blue:#18498B; --blue-2:#2352DE; --violet:#8669B9; --live:#4BA884; --gold:#B9892F; --brick:#A3472F; --navy:#072049;
    --line:rgba(22,34,56,.10); --line-soft:rgba(22,34,56,.06); --muted:rgba(14,10,7,.56); --faint:rgba(14,10,7,.38);
    --radius:14px; --soft:cubic-bezier(0.22,0.61,0.36,1);
    --shadow-soft:0 1px 2px rgba(7,16,40,.04),0 8px 24px rgba(7,16,40,.05);
    /* System stack only: the artifact holds matter content, so it must render
       fully offline and never fetch a webfont. "Geist" is kept first so a
       machine that has it installed still matches the app UI. */
    --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-synthesis:none;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:radial-gradient(1200px 600px at 100% -10%,rgba(35,82,222,.05),transparent 60%),var(--sunken);color:var(--ink);font:400 14px/1.55 var(--sans);letter-spacing:-0.006em;-webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--mono);font-feature-settings:"tnum" 1;}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font:700 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .eyebrow::before{content:"";width:6px;height:6px;background:var(--blue-2);border-radius:1px;}
  header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 24px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;}
  .title-wrap{margin-right:auto;min-width:220px;display:flex;flex-direction:column;gap:6px;}
  h1{margin:0;font:500 21px/1.05 var(--sans);letter-spacing:-0.04em;}
  .meta{color:var(--muted);font-size:12px;} .meta b{color:var(--ink);font-weight:500;}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:8px 14px;min-width:230px;transition:border-color .16s var(--soft),box-shadow .16s var(--soft);}
  .search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,73,139,.10);}
  .search svg{color:var(--faint);flex:none;} .search input{border:0;outline:0;background:transparent;font:400 13px var(--sans);color:var(--ink);width:100%;}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 15px;font:500 13px var(--sans);cursor:pointer;transition:background .16s var(--soft),color .16s var(--soft),border-color .16s var(--soft),transform .12s var(--soft);}
  .btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);} .btn:active{transform:translateY(1px);} .btn svg{width:15px;height:15px;}
  .legend{display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--paper);border-bottom:1px solid var(--line-soft);}
  .legend span.k{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);}
  .sq{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .sq.high{background:var(--live);} .sq.medium{background:var(--gold);} .sq.low{background:var(--brick);} .sq.na{background:rgba(14,10,7,.22);}
  .scroll{overflow:auto;height:calc(100vh - 58px - 39px);}
  table{border-collapse:separate;border-spacing:0;width:100%;background:var(--paper);}
  thead th{position:sticky;top:0;z-index:20;background:var(--paper);text-align:left;vertical-align:bottom;padding:12px 14px;border-bottom:1px solid var(--ink);white-space:nowrap;}
  thead th .lab{font:500 12.5px var(--sans);letter-spacing:-0.01em;} thead th .q{display:block;max-width:230px;white-space:normal;margin-top:3px;font:400 11px/1.35 var(--sans);color:var(--faint);}
  th.doccol,td.doccol{position:sticky;left:0;z-index:10;background:var(--paper);border-right:1px solid var(--line);min-width:214px;max-width:270px;} thead th.doccol{z-index:25;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;} tbody tr:hover td{background:#FBFBFA;} tbody tr:hover td.doccol{background:var(--sunken);}
  .doc-title{font:500 13px var(--sans);letter-spacing:-0.012em;} .doc-file{color:var(--faint);font:400 11px var(--mono);margin-top:3px;max-width:236px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip{display:inline-block;margin-top:7px;padding:2px 9px;border-radius:999px;font:500 10.5px var(--mono);letter-spacing:.02em;background:rgba(35,82,222,.07);color:var(--blue);border:1px solid rgba(35,82,222,.16);}
  .cell{display:grid;grid-template-columns:9px 1fr;gap:9px;align-items:start;cursor:pointer;} .cell .sq{margin-top:5px;}
  .cell .val{font:400 13px/1.4 var(--sans);} .cell.na .val{color:var(--faint);font-style:italic;} .cell:hover .val{color:var(--blue);}
  td.evid .val::after{content:"";display:inline-block;width:5px;height:5px;margin-left:7px;vertical-align:middle;border-radius:50%;background:var(--blue-2);}
  .empty{padding:56px 24px;text-align:center;color:var(--muted);}
  .scrim{position:fixed;inset:0;background:rgba(7,16,40,.22);backdrop-filter:blur(1px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s var(--soft);} .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,96vw);z-index:50;transform:translateX(101%);transition:transform .32s var(--soft);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.78));backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border-left:1px solid rgba(255,255,255,.6);box-shadow:-24px 0 60px rgba(7,16,40,.18),inset 1px 0 0 rgba(255,255,255,.85);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 22px 16px;border-bottom:1px solid var(--line);}
  .drawer-head .row1{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .drawer-head h2{margin:8px 0 0;font:500 19px/1.1 var(--sans);letter-spacing:-0.035em;} .drawer-head h2.na{color:var(--faint);font-style:italic;font-weight:400;}
  .drawer-head .src{margin-top:6px;font:400 11.5px var(--mono);color:var(--muted);}
  .x{display:inline-flex;padding:7px;margin:-7px;border:0;background:transparent;color:var(--faint);cursor:pointer;border-radius:8px;} .x:hover{color:var(--ink);background:rgba(14,10,7,.05);}
  .drawer-body{padding:18px 22px 28px;overflow:auto;}
  .sec{margin-top:22px;} .sec:first-child{margin-top:0;}
  .eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .answer{font:500 18px/1.25 var(--sans);letter-spacing:-0.02em;} .answer.na{color:var(--faint);font-style:italic;font-weight:400;}
  .pill{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:4px 11px;border-radius:999px;font:500 11px var(--mono);letter-spacing:.02em;}
  .pill.high{background:rgba(75,168,132,.12);color:#2f6f57;} .pill.medium{background:rgba(185,137,47,.14);color:#8a6314;} .pill.low{background:rgba(163,71,47,.12);color:#8a3a26;} .pill.na{background:rgba(14,10,7,.06);color:var(--muted);}
  .reason{font:400 14px/1.6 var(--sans);color:rgba(14,10,7,.82);}
  blockquote{margin:8px 0 0;padding:12px 16px;border-left:2px solid var(--blue-2);background:rgba(35,82,222,.045);border-radius:0 10px 10px 0;font:400 13.5px/1.55 var(--sans);color:rgba(14,10,7,.86);}
  /* pdf viewer */
  .pv{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow-soft);}
  .pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft);background:rgba(243,245,248,.7);}
  .pv-bar .nav{display:inline-flex;align-items:center;gap:4px;} .pv-pageno{font:500 11px var(--mono);color:var(--muted);min-width:74px;text-align:center;}
  .pv-ibtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);background:var(--paper);border-radius:8px;cursor:pointer;color:var(--ink);} .pv-ibtn:hover{background:var(--ink);color:var(--paper);} .pv-ibtn:disabled{opacity:.4;cursor:default;background:var(--paper);color:var(--ink);}
  .pv-stage{position:relative;max-height:520px;overflow:auto;background:#f6f6f4;display:flex;justify-content:center;padding:12px;}
  .pv-page{position:relative;line-height:1;box-shadow:0 1px 4px rgba(7,16,40,.12);} .pv-page canvas{display:block;}
  .textLayer{position:absolute;inset:0;overflow:hidden;opacity:1;line-height:1;}
  .textLayer span{position:absolute;white-space:pre;transform-origin:0 0;color:transparent;}
  .textLayer span.hl{background:rgba(185,137,47,.42);border-radius:2px;box-shadow:0 0 0 1px rgba(185,137,47,.55);color:transparent;}
  .pv-status{padding:18px;font:400 12.5px var(--sans);color:var(--muted);text-align:center;}
  .pv-status.err{color:var(--brick);}
  .nopage{margin-top:10px;font:400 12px var(--sans);color:var(--faint);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header>
  <div class="title-wrap">
    <span class="eyebrow">Tabular review</span>
    <h1 id="matter">Document Review</h1>
    <div class="meta mono" id="meta"></div>
  </div>
  <div class="controls">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="search" type="search" placeholder="Filter documents" aria-label="Filter documents" />
    </label>
    <button class="btn" id="csv" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M5 21h14"></path></svg>
      Export CSV
    </button>
  </div>
</header>
<div class="legend">
  <span class="eyebrow">Confidence</span>
  <span class="k"><i class="sq high"></i>High</span><span class="k"><i class="sq medium"></i>Medium</span>
  <span class="k"><i class="sq low"></i>Low</span><span class="k"><i class="sq na"></i>Not found</span>
</div>
<div class="scroll">
  <table id="grid"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  <div class="empty" id="empty" hidden></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="row1"><span class="eyebrow" id="dEyebrow">Field</span>
      <button class="x" id="dClose" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <h2 id="dAnswer"></h2><div class="src mono" id="dSrc"></div>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<script>/*__PDFJS__*/</script>
<script type="text/plain" id="pdf-worker">/*__PDF_WORKER__*/</script>
<script id="review-data" type="application/json">/*__REVIEW_DATA__*/</script>
<script>
(() => {
  "use strict";
  const PDFJS = window["pdfjsLib"] || null;
  if (PDFJS) {
    try {
      const el = document.getElementById("pdf-worker");
      const src = el ? el.textContent : "";
      if (src && src.indexOf("__PDF_WORKER") === -1) {
        PDFJS.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], { type: "application/javascript" }));
      }
    } catch (e) { /* viewer will report load errors */ }
  }
  const $ = (id) => document.getElementById(id);
  const CONF = new Set(["high", "medium", "low"]);
  const confClass = (c) => (CONF.has(c) ? c : "na");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tokenize = (s) => (String(s ?? "").toLowerCase().match(/[\p{L}\p{N}]+/gu) || []);

  const parseData = () => { try { return JSON.parse($("review-data").textContent.trim()); } catch { return null; } };
  const data = parseData();
  const state = { filter: "" };

  const getCell = (row, key) => { const c = row.cells; return !c ? null : Array.isArray(c) ? (c.find((x) => x && x.key === key) || null) : (c[key] || null); };
  const isNA = (cell) => { if (!cell) return true; const v = String(cell.value ?? "").trim().toLowerCase(); return v === "" || v === "not found" || v === "n/a" || v === "na" || v === "unreadable"; };

  /* ---------- PDF bridge + cache ---------- */
  let reqSeq = 0;
  const pending = new Map();
  window.addEventListener("message", (e) => {
    const d = e.data; if (!d || d.type !== "legalwork:pdf-response") return;
    const p = pending.get(d.id); if (!p) return; pending.delete(d.id);
    d.ok ? p.resolve(d.data) : p.reject(new Error(d.error || "Could not load file"));
  });
  function requestBytes(path) {
    return new Promise((resolve, reject) => {
      const id = "r" + reqSeq++; pending.set(id, { resolve, reject });
      window.parent.postMessage({ type: "legalwork:pdf-request", id, path }, "*");
      setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error("The app did not return the file (timed out).")); } }, 20000);
    });
  }
  const pdfCache = new Map();
  function loadPdf(row) {
    const key = row.fileUrl || row.file;
    if (pdfCache.has(key)) return pdfCache.get(key);
    const promise = (async () => {
      if (!PDFJS) throw new Error("PDF viewer unavailable (build with build-review.mjs).");
      let src;
      if (row.fileUrl) src = { url: row.fileUrl };
      else if (window.parent && window.parent !== window) { const bytes = await requestBytes(row.file); src = { data: bytes instanceof ArrayBuffer ? new Uint8Array(bytes) : bytes }; }
      else src = { url: row.file };
      return await PDFJS.getDocument(src).promise;
    })();
    pdfCache.set(key, promise);
    return promise;
  }

  /* ---------- locate quote -> item indices on a page ---------- */
  function matchItems(query, items) {
    const q = tokenize(query); if (q.length < 2) return new Set();
    const flat = [], owner = [];
    items.forEach((it, i) => tokenize(it.str).forEach((t) => { flat.push(t); owner.push(i); }));
    const hay = " " + flat.join(" ") + " ";
    const find = (toks) => { if (toks.length < 2) return null; const at = hay.indexOf(" " + toks.join(" ") + " "); if (at === -1) return null; const before = hay.slice(0, at + 1).trim(); const start = before ? before.split(" ").length : 0; return [start, start + toks.length]; };
    let range = find(q);
    for (let end = q.length; !range && end > Math.max(2, Math.ceil(q.length * 0.5)); end--) range = find(q.slice(0, end));
    for (let start = 1; !range && start < Math.floor(q.length * 0.5); start++) range = find(q.slice(start));
    const set = new Set(); if (!range) return set;
    for (let i = range[0]; i < range[1] && i < owner.length; i++) set.add(owner[i]);
    return set;
  }

  /* ---------- render one page with highlight ---------- */
  async function renderPage(view, pageNum) {
    const { pdf, query, stage } = view;
    view.page = Math.min(pdf.numPages, Math.max(1, pageNum));
    $("pvPageNo").textContent = `Page ${view.page} / ${pdf.numPages}`;
    $("pvPrev").disabled = view.page <= 1; $("pvNext").disabled = view.page >= pdf.numPages;
    const page = await pdf.getPage(view.page);
    const stageW = stage.clientWidth - 24 || 460;
    const unit = page.getViewport({ scale: 1 });
    const scale = Math.max(0.5, Math.min(2.2, stageW / unit.width));
    const viewport = page.getViewport({ scale });
    const dpr = window.devicePixelRatio || 1;
    const wrap = document.createElement("div"); wrap.className = "pv-page"; wrap.style.width = viewport.width + "px"; wrap.style.height = viewport.height + "px";
    const canvas = document.createElement("canvas"); canvas.width = Math.floor(viewport.width * dpr); canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = viewport.width + "px"; canvas.style.height = viewport.height + "px";
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
    wrap.appendChild(canvas);
    const textLayer = document.createElement("div"); textLayer.className = "textLayer"; textLayer.style.width = viewport.width + "px"; textLayer.style.height = viewport.height + "px"; textLayer.style.setProperty("--scale-factor", String(scale)); wrap.appendChild(textLayer);
    stage.innerHTML = ""; stage.appendChild(wrap);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const content = await page.getTextContent();
    const textDivs = [];
    await PDFJS.renderTextLayer({ textContent: content, container: textLayer, viewport, textDivs }).promise;
    const hit = matchItems(query, content.items);
    let first = null;
    hit.forEach((i) => { const el = textDivs[i]; if (el) { el.classList.add("hl"); if (!first) first = el; } });
    if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  async function showPdf(pdf, cell, mount) {
    mount.innerHTML =
      '<div class="pv"><div class="pv-bar"><span class="mono pv-pageno" id="pvPageNo"></span>' +
      '<span class="nav"><button class="pv-ibtn" id="pvPrev" aria-label="Previous page"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>' +
      '<button class="pv-ibtn" id="pvNext" aria-label="Next page"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></span></div>' +
      '<div class="pv-stage" id="pvStage"></div></div>';
    const view = { pdf, query: cell.quote || "", page: cell.page || 1, stage: $("pvStage") };
    $("pvPrev").addEventListener("click", () => renderPage(view, view.page - 1));
    $("pvNext").addEventListener("click", () => renderPage(view, view.page + 1));
    await renderPage(view, view.page);
  }

  // A navigable URL for the source PDF (works as a LINK even when fetch is blocked).
  // Prefer the local absolute file so "open it directly" works even if a URL failed.
  function pdfHref(row, cell) {
    const abs = row.fileAbs || (row.file && /^([a-zA-Z]:[\\/]|\/)/.test(row.file) ? row.file : null);
    let href = abs ? "file://" + encodeURI(abs.replace(/\\/g, "/"))
      : (row.fileUrl && /^(https?|file):/i.test(row.fileUrl)) ? row.fileUrl
        : (row.file || "");
    return href ? href + (cell.page ? "#page=" + cell.page : "") : "";
  }

  function showFallback(row, cell, mount, msg) {
    const href = pdfHref(row, cell);
    mount.innerHTML = '<div class="pv"><div class="pv-status">' + esc(msg || "This PDF can’t be loaded automatically here.") +
      (href ? '<div style="margin-top:12px"><a class="btn" href="' + esc(href) + '" target="_blank" rel="noopener">Open' + (cell.page ? " page " + cell.page : "") + ' in the PDF</a></div>' : "") +
      '<div style="margin-top:10px;font-size:12px">or <label style="color:var(--blue);cursor:pointer;text-decoration:underline">choose the PDF to highlight it here<input id="pvPick" type="file" accept="application/pdf" style="display:none"></label></div>' +
      "</div></div>";
    const pick = $("pvPick");
    if (pick) pick.addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      try { const buf = await f.arrayBuffer(); const pdf = await PDFJS.getDocument({ data: new Uint8Array(buf) }).promise; await showPdf(pdf, cell, mount); }
      catch (err) { showFallback(row, cell, mount, "Could not read that file."); }
    });
  }

  async function mountViewer(row, cell, mount) {
    if (!PDFJS) { mount.innerHTML = '<div class="nopage">PDF viewer unavailable in this build.</div>'; return; }
    // Opened as a saved file (file://): browsers block auto-loading local files. Offer a
    // native "open at page" link + a file picker instead of failing.
    const standaloneFile = window.parent === window && location.protocol === "file:" && !(row.fileUrl && /^https?:/i.test(row.fileUrl));
    if (standaloneFile) { showFallback(row, cell, mount, "Opened from disk — your browser blocks loading local PDFs into a saved page. Open it directly, or pick the file to highlight it here:"); return; }
    mount.innerHTML = '<div class="pv"><div class="pv-status">Loading source page…</div></div>';
    try { const pdf = await loadPdf(row); await showPdf(pdf, cell, mount); }
    catch (err) { showFallback(row, cell, mount, "Couldn’t auto-load the PDF (" + String(err && err.message || err) + "). Open it directly, or pick the file:"); }
  }

  /* ---------- grid ---------- */
  function render() {
    const empty = $("empty");
    if (!data || !Array.isArray(data.columns)) { empty.hidden = false; empty.textContent = "No review data. Build this file with build-review.mjs."; return; }
    $("matter").textContent = data.matter || "Document Review";
    const gen = data.generatedAt ? new Date(data.generatedAt) : null;
    const genTxt = gen && !isNaN(gen) ? gen.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
    $("meta").innerHTML = `<b>${(data.rows || []).length}</b> documents · <b>${data.columns.length}</b> columns${genTxt ? " · " + esc(genTxt) : ""}`;
    const head = $("head"); head.innerHTML = '<th class="doccol"><span class="lab">Document</span></th>';
    data.columns.forEach((col) => { const th = document.createElement("th"); th.innerHTML = `<span class="lab">${esc(col.label || col.key)}</span>` + (col.question ? `<span class="q">${esc(col.question)}</span>` : ""); head.appendChild(th); });
    const body = $("body"); body.innerHTML = ""; const f = state.filter.toLowerCase(); let shown = 0;
    (data.rows || []).forEach((row, ri) => {
      if (f && JSON.stringify(row).toLowerCase().indexOf(f) === -1) return; shown++;
      const tr = document.createElement("tr");
      const tdDoc = document.createElement("td"); tdDoc.className = "doccol";
      const baseName = row.file ? (row.file.split(/[\\/]/).pop() || row.file) : "";
      tdDoc.innerHTML = `<div class="doc-title">${esc(row.title || row.file || "Document " + (ri + 1))}</div>` + (baseName ? `<div class="doc-file" title="${esc(row.file)}">${esc(baseName)}</div>` : "") + (row.docType ? `<span class="chip">${esc(row.docType)}</span>` : "");
      tr.appendChild(tdDoc);
      data.columns.forEach((col) => {
        const cell = getCell(row, col.key); const na = isNA(cell);
        const td = document.createElement("td"); if (cell && cell.quote) td.className = "evid";
        td.innerHTML = `<div class="cell ${na ? "na" : ""}"><i class="sq ${na ? "na" : confClass(cell && cell.confidence)}"></i><span class="val">${esc(na ? "Not found" : cell.value)}</span></div>`;
        td.addEventListener("click", () => openDrawer(row, col, cell));
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    empty.hidden = shown !== 0; if (shown === 0) empty.textContent = "No documents matched.";
  }

  function openDrawer(row, col, cell) {
    const na = isNA(cell); const conf = na ? "na" : confClass(cell && cell.confidence);
    $("dEyebrow").textContent = col.label || col.key;
    $("dAnswer").textContent = na ? "Not found" : cell.value; $("dAnswer").className = na ? "na" : "";
    $("dSrc").textContent = [row.title || row.file, cell && cell.location].filter(Boolean).join("  ·  ");
    const parts = [];
    if (col.question) parts.push(`<div class="sec"><span class="eyebrow">Question</span><div class="reason" style="margin-top:8px">${esc(col.question)}</div></div>`);
    parts.push(`<div class="sec"><span class="eyebrow">Answer</span><div class="answer ${na ? "na" : ""}" style="margin-top:8px">${esc(na ? "Not found" : cell.value)}</div><div><span class="pill ${conf}"><i class="sq ${conf}"></i>${esc(na ? "Not found" : (cell.confidence || "—"))} confidence</span></div></div>`);
    if (cell && cell.reason) parts.push(`<div class="sec"><span class="eyebrow">Reason</span><div class="reason" style="margin-top:8px">${esc(cell.reason)}</div></div>`);
    if (cell && cell.quote) parts.push(`<div class="sec"><span class="eyebrow-row"><span class="eyebrow">Source${cell.page ? " · page " + cell.page : ""}</span></span><blockquote>${esc(cell.quote)}</blockquote><div id="pvMount"></div></div>`);
    if (row.summary) parts.push(`<div class="sec"><span class="eyebrow">Document</span><div class="reason" style="margin-top:8px">${esc(row.summary)}</div></div>`);
    $("dBody").innerHTML = parts.join("");
    $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false"); $("scrim").classList.add("open");
    const mount = $("pvMount");
    if (mount && cell && cell.quote) {
      const isPdf = /\.pdf$/i.test(row.file || "") || Boolean(row.fileUrl);
      if (isPdf && PDFJS) mountViewer(row, cell, mount);
      else if (isPdf) mount.innerHTML = '<div class="nopage">PDF viewer unavailable in this build.</div>';
      else mount.innerHTML = '<div class="nopage">No PDF preview for this document — see the source sentence above.</div>';
    }
  }
  function closeDrawer() { $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").classList.remove("open"); }

  function toCSV() {
    const cols = data.columns || []; const head = ["Document", "File", "Doc type"];
    cols.forEach((c) => { const L = c.label || c.key; head.push(L, `${L} — confidence`, `${L} — page`, `${L} — reason`); });
    const lines = [head];
    (data.rows || []).forEach((row) => { const line = [row.title || "", row.file || "", row.docType || ""]; cols.forEach((c) => { const cell = getCell(row, c.key); const na = isNA(cell); line.push(na ? "Not found" : cell.value, na ? "" : (cell.confidence || ""), cell && cell.page ? cell.page : "", (cell && cell.reason) || ""); }); lines.push(line); });
    const csv = lines.map((r) => r.map((v) => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `${(data.matter || "review").replace(/[^\w.-]+/g, "_")}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  $("search").addEventListener("input", (e) => { state.filter = e.target.value; render(); });
  $("csv").addEventListener("click", toCSV);
  $("dClose").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  render();
})();
</script>
</body>
</html>
