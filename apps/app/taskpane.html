<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LegalWork</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("legalwork.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script>
      // office.js nulls history.pushState/replaceState in some Word webviews,
      // which breaks react-router. Stash the originals and restore them after
      // office.js loads.
      window.__legalworkHistoryCache = {
        replaceState: window.history.replaceState,
        pushState: window.history.pushState,
      };
    </script>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>
      window.history.replaceState =
        window.history.replaceState || window.__legalworkHistoryCache.replaceState;
      window.history.pushState =
        window.history.pushState || window.__legalworkHistoryCache.pushState;
    </script>
  </head>
  <body class="overflow-hidden bg-dls-surface text-dls-text">
    <div id="root"></div>
    <script type="module" src="/src/word-addin/index.tsx"></script>
  </body>
</html>
