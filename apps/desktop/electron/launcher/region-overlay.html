<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Capture region</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: rgba(0,0,0,.18); cursor: crosshair; user-select: none; font: 13px -apple-system, "Segoe UI", sans-serif; }
    #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(20,20,24,.85); color: #fff; }
    #rect { position: fixed; border: 2px solid #3b82f6; background: rgba(59,130,246,.15); display: none; box-shadow: 0 0 0 9999px rgba(0,0,0,.25); }
    #size { position: fixed; padding: 2px 6px; border-radius: 6px; background: rgba(20,20,24,.85); color: #fff; font-size: 11px; display: none; }
  </style>
  <script src="region-overlay.js"></script>
</head>
<body>
  <div id="hint">Drag to capture a region · Esc to cancel</div>
  <div id="rect"></div>
  <div id="size"></div>
</body>
</html>
