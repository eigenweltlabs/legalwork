name: Restore the exact Electron native SQLite build
description: Reuse only the Electron ABI binary and marker; load verification remains in the desktop build
runs:
  using: composite
  steps:
    - name: Identify installed Electron ABI, addon source and native toolchain
      id: key
      shell: bash
      run: node apps/desktop/scripts/electron-native-cache.mjs key
    - uses: actions/cache@v4
      with:
        path: ${{ steps.key.outputs.directory }}
        key: ${{ steps.key.outputs.key }}
