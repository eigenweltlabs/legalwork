name: Protected execution runtime
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      targets:
        description: Comma-separated platform-architecture targets, or all
        type: string
        default: all
      run_tests:
        description: Run sandbox validation after preparing the runtime
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run sandbox validation after preparing the runtime
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      guest: ${{ steps.matrix.outputs.guest }}
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      # Select targets from the workflow commit; ref selects the build sources.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Select runtime targets
        id: matrix
        env:
          SANDBOX_TARGETS: ${{ inputs.targets || 'all' }}
        run: node scripts/sandbox/ci-matrix.mjs
  guest:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.guest) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: node scripts/sandbox/build-guest.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-guest-${{ matrix.arch }}
          path: apps/server/resources/agent-sandbox/runtime/
  runtime:
    needs: [targets, guest]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.runtime) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare checksum-pinned Node for worker tests
        if: inputs.run_tests
        run: node apps/desktop/scripts/prepare-node-runtime.mjs
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-guest-${{ matrix.arch }}
          path: apps/server/resources/agent-sandbox/runtime/
      - name: Build QEMU (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install ninja pkgconf
          bash scripts/sandbox/build-macos.sh ${{ matrix.qemu }}
      - name: Install QEMU build dependency (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
      - name: Download QEMU packages with retries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          for attempt in 1 2 3; do
            pacman -S --noconfirm --needed ${{ matrix.package }}-qemu ${{ matrix.package }}-cc && exit 0
            sleep 5
          done
          exit 1
      - name: Bundle QEMU (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cc -O2 -municode -static scripts/sandbox/host-windows.c -o apps/server/resources/agent-sandbox/runtime/legalwork-host.exe
          node scripts/sandbox/package-runtime.mjs "$(cygpath -w /${{ matrix.prefix }}/bin/qemu-system-${{ matrix.qemu }}.exe)"
      - name: Build QEMU (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y ninja-build libglib2.0-dev libpixman-1-dev libslirp-dev python3-venv
          curl -fL https://download.qemu.org/qemu-11.1.2.tar.xz -o "$RUNNER_TEMP/qemu.tar.xz"
          echo "731b5681e4bb18be313231579b8efd0296c5b015fa36dc533874b639ba838016  $RUNNER_TEMP/qemu.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/qemu-11.1.2"
          ./configure --prefix="$RUNNER_TEMP/qemu" --target-list=${{ matrix.qemu }}-softmmu --without-default-features --enable-tcg --enable-slirp
          make -j2
          make install
      - name: Bundle QEMU (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="$RUNNER_TEMP/qemu/bin/qemu-system-${{ matrix.qemu }}"
          QEMU_SOURCE_DIR="$RUNNER_TEMP/qemu-11.1.2" SANDBOX_DEPENDENCY_LICENSES="$RUNNER_TEMP/qemu-deps/share/licenses" node scripts/sandbox/package-runtime.mjs "$binary"
      # Preserve the built runtime before validation so manual package diagnostics
      # can run independently. Uploading it does not certify that tests passed.
      - name: Preserve executable modes in runtime artifact
        shell: bash
        run: tar -czf sandbox-runtime.tgz -C apps/server/resources/agent-sandbox/runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: sandbox-runtime.tgz
      - name: Test packaged sandbox paths and macOS compatibility
        if: inputs.run_tests
        run: node --test scripts/sandbox/probe-packaged.test.mjs scripts/sandbox/macos-compatibility.test.mjs
      - name: Record temporary filesystem capacity
        if: inputs.run_tests
        shell: bash
        run: |
          for runtime in node bun; do
            "$runtime" -e 'const fs = require("node:fs"), os = require("node:os"); const temporary = os.tmpdir(), space = fs.statfsSync(temporary); console.log(JSON.stringify({ kind: "sandbox-tmp-capacity", node: process.versions.node, bun: process.versions.bun, platform: process.platform, arch: process.arch, temporary, statfs: space, availableBytes: space.bavail * space.bsize }));'
            temporary="$("$runtime" -e 'process.stdout.write(require("node:os").tmpdir())')"
            if [ "$RUNNER_OS" = Windows ]; then temporary="$(cygpath -u "$temporary")"; fi
            df -Pk "$temporary"
          done
      - name: Exercise real isolation and permission enforcement
        if: inputs.run_tests
        timeout-minutes: 30
        env:
          LEGALWORK_SANDBOX_INTEGRATION: '1'
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            sysctl -i kern.hv_support kern.hv_vmm_present hw.optional.arm64
          fi
          bun test --preload ./apps/server/test-preload.ts --timeout 180000 apps/server/src/agent-sandbox apps/server/src/calculations/calculations.test.ts apps/server/src/approvals.test.ts apps/server/src/skill-package.test.ts
