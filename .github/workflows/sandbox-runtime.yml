name: Protected execution runtime
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      targets:
        description: Comma-separated platform-architecture targets, or all
        type: string
        default: all
      run_tests:
        description: Run sandbox validation after preparing the runtime
        type: boolean
        default: true
      publish_runtime:
        description: Retain native runtime artifacts for same-run consumers
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated platform-architecture targets, or all
        type: string
        default: all
      run_tests:
        description: Run sandbox validation after preparing the runtime
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      guest: ${{ steps.matrix.outputs.guest }}
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      # Select targets from the workflow commit; ref selects the build sources.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Select runtime targets
        id: matrix
        env:
          SANDBOX_TARGETS: ${{ inputs.targets || 'all' }}
        run: node scripts/sandbox/ci-matrix.mjs
  guest:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.guest) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Identify exact sandbox build inputs
        id: runtime-key
        run: node scripts/ci/cache-sandbox-runtime.mjs key guest ${{ matrix.arch }}
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: apps/server/resources/agent-sandbox/runtime
          key: ${{ steps.runtime-key.outputs.key }}
      - name: Verify restored sandbox bytes
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: node scripts/ci/cache-sandbox-runtime.mjs verify guest ${{ matrix.arch }}
      - run: node scripts/sandbox/build-guest.mjs ${{ matrix.arch }}
        if: steps.runtime-cache.outputs.cache-hit != 'true'
      - name: Seal newly built sandbox bytes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/cache-sandbox-runtime.mjs seal guest ${{ matrix.arch }}
      - name: Verify complete sandbox cache receipt
        run: node scripts/ci/cache-sandbox-runtime.mjs verify guest ${{ matrix.arch }}
      # GitHub scopes PR saves to their merge ref; only the dev warmer seeds dev.
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: apps/server/resources/agent-sandbox/runtime
          key: ${{ steps.runtime-key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-guest-${{ matrix.arch }}
          path: apps/server/resources/agent-sandbox/runtime/*
          include-hidden-files: false
          retention-days: 1
  runtime:
    needs: [ targets, guest ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.runtime) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Identify exact sandbox build inputs
        id: runtime-key
        run: node scripts/ci/cache-sandbox-runtime.mjs key runtime ${{ matrix.arch }}
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: apps/server/resources/agent-sandbox/runtime
          key: ${{ steps.runtime-key.outputs.key }}
      - name: Verify restored sandbox bytes
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: node scripts/ci/cache-sandbox-runtime.mjs verify runtime ${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        if: inputs.run_tests
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
        if: inputs.run_tests
      - uses: ./.github/actions/install-dependencies
        if: inputs.run_tests
        with:
          filter: legalwork-server...
      - name: Prepare checksum-pinned Node for worker tests
        if: inputs.run_tests
        run: node apps/desktop/scripts/prepare-node-runtime.mjs
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-guest-${{ matrix.arch }}
          path: apps/server/resources/agent-sandbox/runtime/
        if: steps.runtime-cache.outputs.cache-hit != 'true'
      - uses: ./.github/actions/build-sandbox-runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          qemu: ${{ matrix.qemu }}
          msystem: ${{ matrix.msystem || '' }}
          prefix: ${{ matrix.prefix || '' }}
      - name: Seal newly built sandbox bytes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/cache-sandbox-runtime.mjs seal runtime ${{ matrix.arch }}
      - name: Verify complete sandbox cache receipt
        run: node scripts/ci/cache-sandbox-runtime.mjs verify runtime ${{ matrix.arch }}
      - name: Verify native runtime before reuse or shipping
        shell: bash
        run: |
          node scripts/sandbox/verify-runtime.mjs
          node -e 'const {spawnSync}=require("node:child_process"),p=require("node:path");const arch=process.arch==="arm64"?"aarch64":"x86_64";const r=spawnSync(p.resolve("apps/server/resources/agent-sandbox/runtime/qemu-system-"+arch+(process.platform==="win32"?".exe":"")),["--version"],{stdio:"inherit"});process.exit(r.status??1)'
      # GitHub scopes PR saves to their merge ref; only the dev warmer seeds dev.
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: apps/server/resources/agent-sandbox/runtime
          key: ${{ steps.runtime-key.outputs.key }}
      - name: Keep cache receipts out of shipped runtimes
        run: node -e 'require("node:fs").unlinkSync("apps/server/resources/agent-sandbox/runtime/.ci-cache-receipt.json")'
      # Preserve the built runtime before validation so manual package diagnostics
      # can run independently. Uploading it does not certify that tests passed.
      - name: Preserve executable modes in runtime artifact
        if: inputs.publish_runtime
        shell: bash
        run: tar -czf sandbox-runtime.tgz -C apps/server/resources/agent-sandbox/runtime .
      - uses: actions/upload-artifact@v4
        if: inputs.publish_runtime
        with:
          name: sandbox-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: sandbox-runtime.tgz
      - uses: ./.github/actions/test-sandbox-runtime
        if: inputs.run_tests
