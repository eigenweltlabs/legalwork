name: legalwork-ui-mcp

on:
  push:
    branches: [dev]
    tags:
      - "legalwork-ui-mcp-v*"
  pull_request:
    branches: [dev, codex/projects-akte-workspace, codex/opencode-v2-migration]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui_mcp: ${{ steps.scope.outputs.ui_mcp }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope
  check:
    needs: changes
    if: needs.changes.outputs.ui_mcp == 'true'
    name: Syntax & dry-run publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/legalwork-ui-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Syntax check
        run: node --check index.mjs

      - name: Dry-run publish
        run: npm publish --dry-run --access public

  publish:
    name: Publish to npm
    needs: check
    if: startsWith(github.ref, 'refs/tags/legalwork-ui-mcp-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/legalwork-ui-mcp

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Syntax check
        run: node --check index.mjs

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
