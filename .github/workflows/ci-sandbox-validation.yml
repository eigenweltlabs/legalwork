name: Native sandbox validation
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      dependency-cache:
        type: boolean
        default: true
      runtime-artifact:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/prepare-sandbox-runtime
        if: inputs.runtime-artifact == false
        with:
          arch: ${{ inputs.arch }}
          qemu: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          msystem: ${{ inputs.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
          prefix: ${{ inputs.arch == 'arm64' && 'clangarm64' || 'ucrt64' }}
      - uses: ./.github/actions/install-dependencies
        with:
          filter: legalwork-server...
          cache: ${{ inputs.dependency-cache }}
      - name: Prepare checksum-pinned Node for worker tests
        run: node apps/desktop/scripts/prepare-node-runtime.mjs
      - uses: actions/download-artifact@v4
        if: inputs.runtime-artifact
        with:
          name: sandbox-runtime-${{ inputs.platform }}-${{ inputs.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack exact same-run runtime
        if: inputs.runtime-artifact
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz"
          if [ "$RUNNER_OS" = Windows ]; then archive="$(cygpath -u "$archive")"; fi
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime
      - uses: ./.github/actions/test-sandbox-runtime

