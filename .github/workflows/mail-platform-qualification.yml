name: Mail platform qualification (non-release)
on:
  workflow_dispatch:
  push:
    branches: [feat/local-mail-client]
    paths: ['apps/server/src/mail/**', 'apps/server/scripts/mail-acceptance.mjs', 'apps/desktop/electron/mail-*.mjs', 'scripts/mail/**', '.github/workflows/mail-platform-qualification.yml', 'pnpm-lock.yaml']
  pull_request:
    branches: [dev]
    paths: ['apps/server/src/mail/**', 'apps/server/scripts/mail-acceptance.mjs', 'apps/desktop/electron/mail-*.mjs', 'scripts/mail/**', '.github/workflows/mail-platform-qualification.yml', 'pnpm-lock.yaml']
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MAIL_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Actual Electron vault, ACL, cipher and recovery
        run: node scripts/mail/platform-qualification.mjs
      - name: Actual Node mail acceptance
        run: node apps/server/scripts/mail-acceptance.mjs
      - name: Actual isolated Electron ASAR native loading and rotation
        run: node --test apps/desktop/electron/mail-packaging.test.mjs
