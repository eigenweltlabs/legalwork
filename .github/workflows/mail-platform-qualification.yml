name: Mail focused final follow-up (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MAIL_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Complete Windows native suite beyond the old global deadline
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node scripts/mail/qualification-step.mjs native node apps/server/scripts/mail-acceptance.mjs
      - name: Intel MIME backpressure and cancellation regressions
        if: ${{ !cancelled() && matrix.os == 'macos-15-intel' }}
        run: node scripts/mail/qualification-step.mjs native node apps/server/scripts/mail-acceptance.mjs --suite mime/project --test-name-pattern '8MiB generated|deadline and cancellation'
      - name: Windows HTTP cleanup regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node scripts/mail/qualification-step.mjs http bun test apps/server/src/mail/routes.e2e.test.ts apps/server/src/mail/search.e2e.test.ts apps/server/src/mail/local.e2e.test.ts
      - name: Windows renderer regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs renderer bun test tests/mail-actions.test.ts tests/mail-context-render.test.ts tests/mail-conversation-render.test.ts tests/mail-frame-privileges.test.ts tests/mail-html-render.test.ts tests/mail-keyboard-workflow.test.ts
      - name: Apple Silicon renderer regressions
        if: ${{ !cancelled() && matrix.os == 'macos-15' }}
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs renderer bun test tests/mail-conversation-render.test.ts tests/mail-frame-privileges.test.ts tests/mail-html-render.test.ts tests/mail-keyboard-workflow.test.ts
      - name: Intel renderer regressions
        if: ${{ !cancelled() && matrix.os == 'macos-15-intel' }}
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs renderer bun test tests/mail-conversation-render.test.ts tests/mail-frame-privileges.test.ts tests/mail-html-render.test.ts
      - name: Windows preview and shared storage mock isolation
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs preview bun test tests/mail-preview-security.test.ts tests/mail-preview-source.test.ts tests/notification-store.test.ts tests/storage-file-tabs.test.ts tests/task-notifications.test.ts
      - name: Windows actual vault and second-user access check
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node scripts/mail/qualification-step.mjs vault node scripts/mail/platform-qualification.mjs
      - name: Retain bounded synthetic validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-focused-${{ matrix.os }}-${{ github.sha }}
          path: |
            mail-qualification-evidence/
            apps/app/mail-qualification-evidence/
          retention-days: 7
