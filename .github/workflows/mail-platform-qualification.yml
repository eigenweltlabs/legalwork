name: Mail final platform qualification (non-release)
on:
  # Run after all mail tickets are complete; ticket work uses feature-specific tests.
  workflow_dispatch:
  # Bootstrap this PR-only workflow after the final integration gate.
  push:
    branches: [qualify/mail-eig-152-final]
permissions:
  contents: read
concurrency:
  group: mail-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mail-platform-qualification]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            application: apps/desktop/dist-electron/mac-arm64/LegalWork.app
          - os: macos-15-intel
            arch: x64
            application: apps/desktop/dist-electron/mac/LegalWork.app
          - os: windows-2022
            arch: x64
            application: apps/desktop/dist-electron/win-unpacked
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MAIL_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Actual Electron vault, ACL, cipher and recovery
        run: node scripts/mail/qualification-step.mjs vault node scripts/mail/platform-qualification.mjs
      - name: Actual Node mail acceptance
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs native node apps/server/scripts/mail-acceptance.mjs
      - name: Actual loopback HTTP mail APIs
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs http bun test apps/server/src/mail/routes.e2e.test.ts apps/server/src/mail/search.e2e.test.ts apps/server/src/mail/local.e2e.test.ts
      - name: Normal shared app tests
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs app pnpm --filter @legalwork/app test
      - name: Normal desktop tests
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs desktop pnpm --filter @legalwork/desktop test
      - name: Additional mail desktop boundaries
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs desktop-mail node scripts/mail/desktop-qualification-tests.mjs
      - name: Build complete desktop package without publication
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs build pnpm --dir apps/desktop run package:electron:dir --publish never
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MACOS_NOTARIZE: 'false'
          LEGALWORK_COMPUTER_USE_SIGN_IDENTITY: '-'
          LEGALWORK_COMPUTER_USE_CODESIGN_IDENTITY: '-'
      - name: Verify mail from the built application
        if: ${{ !cancelled() }}
        run: node scripts/mail/qualification-step.mjs packaged node scripts/mail/verify-built-application.mjs "${{ matrix.application }}"
      - name: Archive bounded source-stamped qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-qualification-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: mail-qualification-evidence/
          if-no-files-found: error
          retention-days: 14
  windows-prerequisites:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mail-platform-diagnostics]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Diagnose synthetic Windows prerequisites
        run: node scripts/mail/qualification-step.mjs prerequisites node scripts/mail/windows-prerequisites.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-windows-prerequisites-${{ github.sha }}
          path: mail-qualification-evidence/
          if-no-files-found: error
          retention-days: 14
