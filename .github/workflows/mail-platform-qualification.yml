name: Mail final platform qualification (non-release)
on:
  # Run after all mail tickets are complete; ticket work uses feature-specific tests.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            application: apps/desktop/dist-electron/mac-arm64/LegalWork.app
          - os: macos-15-intel
            arch: x64
            application: apps/desktop/dist-electron/mac/LegalWork.app
          - os: windows-2022
            arch: x64
            application: apps/desktop/dist-electron/win-unpacked
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MAIL_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Actual Electron vault, ACL, cipher and recovery
        run: node scripts/mail/platform-qualification.mjs
      - name: Actual Node mail acceptance
        run: node apps/server/scripts/mail-acceptance.mjs
      - name: Actual loopback HTTP mail APIs
        run: bun test apps/server/src/mail/routes.e2e.test.ts apps/server/src/mail/search.e2e.test.ts apps/server/src/mail/local.e2e.test.ts
      - name: Actual isolated Electron ASAR native loading and rotation
        run: node --test apps/desktop/electron/mail-packaging.test.mjs
      - name: Build complete desktop package without publication
        run: pnpm --dir apps/desktop run package:electron:dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MACOS_NOTARIZE: 'false'
          LEGALWORK_COMPUTER_USE_SIGN_IDENTITY: '-'
          LEGALWORK_COMPUTER_USE_CODESIGN_IDENTITY: '-'
      - name: Verify mail from the built application
        run: node scripts/mail/verify-built-application.mjs "${{ matrix.application }}"
