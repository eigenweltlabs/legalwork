name: Mail targeted Windows regressions (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked server dependencies
        run: pnpm --filter legalwork-server... install --frozen-lockfile
      - name: Encrypted database and long Unicode profiles
        run: node apps/server/scripts/mail-acceptance.mjs --suite storage/database
      - name: Rotation and recovery through actual private Node worker
        if: ${{ !cancelled() }}
        run: node apps/server/scripts/mail-acceptance.mjs --suite storage/maintenance
      - name: Archive import and durable exports
        if: ${{ !cancelled() }}
        run: node apps/server/scripts/mail-acceptance.mjs --suite storage/portability
      - name: Gmail stalled raw handler acquisition
        if: ${{ !cancelled() }}
        run: node apps/server/scripts/mail-acceptance.mjs --suite providers/gmail-backfill --test-name-pattern "raw-handler acquisition timeout"
      - name: Graph bounded folder hierarchy transaction
        if: ${{ !cancelled() }}
        run: node apps/server/scripts/mail-acceptance.mjs --suite providers/graph-backfill --test-name-pattern "folder hierarchy application"
      - name: Offline original EML rendering boundary
        if: ${{ !cancelled() }}
        run: node apps/server/scripts/mail-acceptance.mjs --suite mime/project --test-name-pattern "original rendering EML"
