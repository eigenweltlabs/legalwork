name: Mail bounded second-user diagnostic (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - name: Original and instrumented second-user denial with public readable control
        run: node scripts/mail/windows-other-user-diagnostic.mjs
