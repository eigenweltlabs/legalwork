name: Mail remaining focused acceptance (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MAIL_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: HTML layout and isolation readiness
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs html bun test tests/mail-html-render.test.ts
      - name: Windows preview and shared storage isolation
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 2
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs preview bun test tests/mail-preview-security.test.ts tests/mail-preview-source.test.ts tests/notification-store.test.ts tests/storage-file-tabs.test.ts tests/task-notifications.test.ts
      - name: Windows historical recovery with real ACLs
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 3
        run: node scripts/mail/qualification-step.mjs recovery node apps/server/scripts/mail-acceptance.mjs --suite storage/recovery
      - name: Windows actual vault and second-user boundary
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 4
        run: node scripts/mail/qualification-step.mjs vault node scripts/mail/platform-qualification.mjs
      - name: MIME streaming and cancellation regressions
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: node scripts/mail/qualification-step.mjs mime node apps/server/scripts/mail-acceptance.mjs --suite mime/project
      - name: Windows Bun junction cleanup controls
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 2
        run: node scripts/mail/qualification-step.mjs junction bun test scripts/mail/link-test-modules.test.mjs
      - name: Windows HTTP cleanup regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 3
        run: node scripts/mail/qualification-step.mjs http bun test apps/server/src/mail/routes.e2e.test.ts apps/server/src/mail/search.e2e.test.ts apps/server/src/mail/local.e2e.test.ts
      - name: Retain bounded synthetic validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-remaining-${{ matrix.os }}-${{ github.sha }}
          path: |
            mail-qualification-evidence/
            apps/app/mail-qualification-evidence/
          retention-days: 7
