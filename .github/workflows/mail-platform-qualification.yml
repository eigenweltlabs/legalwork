name: Mail bounded Windows storage probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install isolated pinned native probe dependency
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'mail-native-probe'
          New-Item -ItemType Directory -Path $probe | Out-Null
          Set-Content -Path (Join-Path $probe 'package.json') -Value '{"private":true}'
          pnpm --dir $probe add better-sqlite3-multiple-ciphers@13.0.3 --ignore-scripts
          node scripts/mail/windows-storage-probe.mjs $probe
