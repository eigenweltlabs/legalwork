name: Mail signed first-launch diagnostic (NO RELEASE)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-startup:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QUALIFICATION_SOURCE: 5060005ed
      TARGET: aarch64-apple-darwin
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: arm64
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Instrument unchanged production startup for observation
        run: |
          git diff --exit-code "$QUALIFICATION_SOURCE" -- apps packages scripts/release
          node scripts/mail/signed-qualification/prepare.mjs
          mkdir -p "$RUNNER_TEMP/mail-startup-evidence"
          git diff -- apps/desktop/electron/main.mjs apps/desktop/electron/updater.mjs > "$RUNNER_TEMP/mail-startup-evidence/instrumentation.patch"
          git rev-parse "$QUALIFICATION_SOURCE" > "$RUNNER_TEMP/mail-startup-evidence/product-source.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/mail-startup-evidence/qualification-commit.txt"
      - name: Build actual production desktop once
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Write temporary notary key
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign and notarize one directory app with production hook
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: 'true'
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml \
            --mac --arm64 --dir --publish never \
            -c.extraMetadata.version=0.0.1 -c.directories.output="$RUNNER_TEMP/mail-startup-app"
      - name: Record keychain paths without reading credentials
        run: |
          security default-keychain -d user > "$RUNNER_TEMP/mail-startup-evidence/default-keychain.txt"
          security list-keychains -d user > "$RUNNER_TEMP/mail-startup-evidence/search-keychains.txt"
      - name: Assess quarantined signed first launch and observe actual startup
        timeout-minutes: 8
        run: node scripts/mail/signed-qualification/smoke.mjs "$RUNNER_TEMP/mail-startup-app/mac-arm64/LegalWork.app" "$RUNNER_TEMP/mail-startup-evidence" --signed
      - name: Remove temporary notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Retain diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-signed-startup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mail-startup-evidence/*.json
            ${{ runner.temp }}/mail-startup-evidence/*.txt
            ${{ runner.temp }}/mail-startup-evidence/*.patch
            ${{ runner.temp }}/mail-startup-evidence/timeout-screen.png
          retention-days: 7
