name: Mail HTML and HTTP final boundaries (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: HTML frame reads and isolation
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        working-directory: apps/app
        run: node ../../scripts/mail/qualification-step.mjs html bun test tests/mail-html-render.test.ts
      - name: Windows junction cleanup controls
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 2
        run: node scripts/mail/qualification-step.mjs junction bun test scripts/mail/link-test-modules.test.mjs
      - name: Windows local HTTP cleanup
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 3
        run: node scripts/mail/qualification-step.mjs http bun test apps/server/src/mail/local.e2e.test.ts
      - name: Retain bounded synthetic validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-boundaries-${{ matrix.os }}-${{ github.sha }}
          path: |
            mail-qualification-evidence/
            apps/app/mail-qualification-evidence/
          retention-days: 7
