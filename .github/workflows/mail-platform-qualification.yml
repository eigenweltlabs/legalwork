name: Mail Windows HTTP final check (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked server dependencies
        run: pnpm --filter 'legalwork-server...' install --frozen-lockfile
      - name: Draft and upload HTTP process lifetime
        timeout-minutes: 3
        run: node scripts/mail/qualification-step.mjs http bun test apps/server/src/mail/local.e2e.test.ts
      - name: Retain bounded synthetic validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-http-${{ github.sha }}
          path: mail-qualification-evidence/
          retention-days: 7
