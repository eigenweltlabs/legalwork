name: Mail Linux focused renderer qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-renderers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare sandboxed Electron
        shell: bash
        run: |
          set -euo pipefail
          sandbox_path="$(pnpm --filter @legalwork/desktop exec node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          command -v xvfb-run
      - name: Verify restricted child display environment
        run: pnpm --filter @legalwork/app exec bun test tests/mail-browser-fixture.test.ts --test-name-pattern 'restricted Electron fixture'
      - name: Repaired display and three previously unexplained renderer timeouts
        run: xvfb-run --auto-servernum pnpm --filter @legalwork/app exec bun test tests/mail-animation-security.test.ts tests/mail-sender-identities.test.ts tests/mail-outbox.test.ts tests/mail-shared-identities.test.ts
      - name: Isolated unrelated approval keyboard case
        if: always()
        run: pnpm --filter @legalwork/app exec bun test tests/permission-approval-modal.test.ts --test-name-pattern 'keeps keyboard order'
