name: i18n Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  i18n-audit:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'feat/local-mail-client' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run i18n audit
        run: node scripts/i18n-audit.mjs --ci
