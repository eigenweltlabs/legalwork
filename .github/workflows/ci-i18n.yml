name: i18n Audit

on:
  pull_request:
    branches:
      - dev
      - codex/projects-akte-workspace
      - codex/opencode-v2-migration
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      i18n: ${{ steps.scope.outputs.i18n }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope
  i18n-audit:
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Run i18n audit
        run: node scripts/i18n-audit.mjs --ci
