name: Desktop Package Smoke Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-smoke:
    name: Package and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            executable: linux-unpacked/legalwork
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win
            arch: x64
            executable: win-unpacked/LegalWork.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win
            arch: arm64
            executable: win-arm64-unpacked/LegalWork.exe
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test config migration, token-file migration and link policy
        run: node --test apps/desktop/electron/opencode-config-migration.test.mjs apps/desktop/electron/runtime.test.mjs apps/desktop/electron/ui-control-server.test.mjs apps/desktop/electron/safe-open.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-${{ matrix.platform == 'win' && 'win32' || matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz"
          if [ "$RUNNER_OS" = Windows ]; then archive="$(cygpath -u "$archive")"; fi
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime

      - name: Build desktop app and native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Package desktop app
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
      - name: Verify Linux AppImage packaging
        if: runner.os == 'Linux'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage --x64 --publish never
      - name: Verify shipped fuses, Node and document tools
        run: pnpm --dir apps/desktop check:packaged-security "dist-electron/${{ matrix.executable }}"
      - name: Run isolation probe with the packaged Node and VM
        run: |
          bun build scripts/sandbox/probe.ts --target=node --outfile=scripts/sandbox/probe.mjs
          node scripts/sandbox/probe-packaged.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"
      - name: Verify Windows native modules
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: pnpm --dir apps/desktop test:native
      - name: Verify Windows preview isolation
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: pnpm --dir apps/desktop test:preview-security
      - name: Verify Windows packaged startup
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"
      - name: Verify Windows installer packaging
        if: runner.os == 'Windows'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win --${{ matrix.arch }} --publish never
      - name: Upload Windows test installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.arch }}
          path: apps/desktop/dist-electron/legalwork-win-${{ matrix.arch }}-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Verify Linux native modules
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a pnpm --dir apps/desktop exec electron --no-sandbox scripts/native-modules-regression.mjs
      - name: Verify Linux preview isolation
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a pnpm --dir apps/desktop test:preview-security --no-sandbox
      - name: Verify Linux packaged startup
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"
