name: Alpha Channel (Windows x64 + ARM64)

# Each dev merge affecting the app builds an alpha. Required PR checks
# already ran before merge; packaging does not rerun the sandbox suite.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sandbox_tests:
        description: Run sandbox validation tests (manual opt-in only)
        type: boolean
        default: false
      signing_test:
        description: Validate Azure signing without publishing
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: alpha-windows-x64-${{ github.sha }}-${{ inputs.signing_test }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      alpha: ${{ steps.scope.outputs.alpha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope
  opencode-engine:
    needs: changes
    if: needs.changes.outputs.alpha == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-opencode-derivative.yml
    with:
      build-mode: production
      ref: ${{ github.sha }}
    secrets:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
  sandbox-runtime:
    needs: changes
    if: needs.changes.outputs.alpha == 'true'
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: win32-x64,win32-arm64
      run_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox_tests || false }}
  publish-alpha-windows:
    needs: [sandbox-runtime, opencode-engine]
    environment: windows-signing
    permissions:
      actions: read
      contents: write
      id-token: write
    name: Build + Publish alpha (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
            manifest: latest.yml
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            manifest: latest-arm64.yml
    timeout-minutes: 180

    env:
      ALPHA_RELEASE_TAG: alpha-windows-latest
      ALPHA_RELEASE_NAME: LegalWork Alpha (Windows)
      ALPHA_ARCH: ${{ matrix.arch }}
      UPDATER_MANIFEST: ${{ matrix.manifest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full history so `git describe` can find the latest v* release tag —
          # alpha versions are derived from it (package.json is a placeholder).
          fetch-depth: 0

      - name: Enable git long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Download the same-run source-built engine
        uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          path: ${{ runner.temp }}/opencode-derivative
      - name: Verify and prepare the production engine
        uses: ./.github/actions/setup-opencode
        with:
          build-mode: production
          archive-directory: ${{ runner.temp }}/opencode-derivative/archives
          manifest-sha256: ${{ needs.opencode-engine.outputs.manifest-sha256 }}


      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve alpha version
        id: alpha-version
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The latest v* tag reachable from this commit is the version source
          # of truth (package.json only carries a 0.0.0 placeholder). Alpha
          # builds advertise the *next* patch version so semver comparison
          # makes the alpha newer than the current stable. Once that stable
          # ships, its semver beats the alpha prerelease tag and alpha users
          # cleanly migrate forward.
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
          base="${latest_tag#v}"
          base="${base%%[-+]*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $latest_tag" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$base"
          next_patch=$((patch + 1))
          run="${GITHUB_RUN_NUMBER:-0}"
          sha="${GITHUB_SHA:0:7}"
          sha="${sha:-local}"
          echo "Latest release tag: $latest_tag -> alpha base ${major}.${minor}.${next_patch}"
          # The commit sha rides in the prerelease part (…-alpha.<run>.g<sha>),
          # not as +<sha> build metadata: pnpm refuses to workspace-link the
          # exact-pinned internal deps (legalwork-server) when
          # the stamped version carries build metadata, and falls back to the
          # public npm registry (404 / name-squatted package). The "g" prefix
          # (git describe's convention) keeps the identifier valid semver: a
          # sha made of digits only with a leading zero, such as 0904434, is
          # not a legal numeric prerelease identifier, and pnpm then cannot
          # match the workspace package either and falls back the same way.
          {
            echo "alpha_version=${major}.${minor}.${next_patch}-alpha.${run}.g${sha}"
            echo "base_version=${major}.${minor}.${next_patch}"
            echo "release_tag=alpha-windows-${ALPHA_ARCH}-v${major}.${minor}.${next_patch}-alpha.${run}-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp alpha version
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        # Lockfile-only resync keeps pnpm-lock.yaml consistent with the stamped
        # orchestrator dependency pins so later pnpm invocations don't reject
        # the workspace (installs stay explicit + frozen before this step).
        run: |
          node scripts/release/apply-version.mjs --version "$ALPHA_VERSION"
          pnpm install --lockfile-only --no-frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-win32-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$(cygpath -u "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz")"
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime

      - name: Build Electron alpha app
        shell: bash
        env:
          # TARGET tells prepare-sidecar.mjs which architecture's sidecars
          # to download.
          TARGET: ${{ matrix.target }}
          # The renderer bundle (vite build) peaks above Node's default heap.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @legalwork/desktop build:electron:production

      # Authenticate after the long build so the Azure CLI token is fresh.
      - name: Sign in to Azure signing
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package Electron alpha (Windows)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.azure.yml \
            --win --${{ matrix.arch }} \
            --publish never

      - name: Verify signed Windows artifacts
        shell: pwsh
        run: |
          $appDir = if ($env:ALPHA_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          ./scripts/release/verify-windows-signature.ps1 -ArtifactDirectory "apps/desktop/dist-electron" -AppExecutable "apps/desktop/dist-electron/$appDir/LegalWork.exe"

      - name: Verify packaged startup
        timeout-minutes: 3
        shell: pwsh
        run: |
          $appDir = if ($env:ALPHA_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/$appDir/LegalWork.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Separate Windows ARM64 updater feed
        if: matrix.arch == 'arm64'
        shell: bash
        run: mv apps/desktop/dist-electron/latest.yml apps/desktop/dist-electron/latest-arm64.yml

      - name: Create immutable alpha prerelease
        if: ${{ !inputs.signing_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          printf -v body '%s\n\n%s' \
            "Rolling alpha build for LegalWork (Windows ${ALPHA_ARCH}) from ${GITHUB_SHA}." \
            "[Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CODE_SIGNING_POLICY.md)"
          if gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Alpha prerelease $ALPHA_RUN_RELEASE_TAG already exists; reusing it."
            exit 0
          fi
          gh release create "$ALPHA_RUN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LegalWork Alpha ${ALPHA_VERSION} (Windows ${ALPHA_ARCH})" \
            --notes "$body" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --draft

      - name: Upload Electron alpha updater assets
        if: ${{ !inputs.signing_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          if [ "$(jq -r .targetCommitish <<<"$release")" != "$GITHUB_SHA" ]; then
            echo "Existing alpha points at a different source commit" >&2
            exit 1
          fi
          if [ "$(jq -r .isDraft <<<"$release")" != true ]; then
            echo "Alpha is already published; preserve its immutable artifacts."
            exit 0
          fi
          shopt -s nullglob
          assets=(
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/"$UPDATER_MANIFEST"
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Electron alpha assets found in apps/desktop/dist-electron" >&2
            exit 1
          fi
          gh release upload "$ALPHA_RUN_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish complete alpha
        if: ${{ !inputs.signing_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          if [ "$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --tag "$ALPHA_RUN_RELEASE_TAG" --target "$GITHUB_SHA" --draft=false --prerelease --latest=false
          fi

      - name: Upload signed Windows test artifacts
        if: inputs.signing_test
        uses: actions/upload-artifact@v4
        with:
          name: azure-signing-test-windows-${{ matrix.arch }}
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 7
