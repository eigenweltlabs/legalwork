name: Windows ARM64 speech acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  speech:
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      TARGET: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install-dependencies
        with:
          filter: '@legalwork/desktop...'
          ignore-scripts: 'true'
      - name: Verify notice integrity and cold-build regressions on Windows ARM64
        run: node --test scripts/ci/windows-arm64-speech-cache.test.mjs
      - name: Compile and load the native speech adapter without the speech cache
        run: node apps/desktop/scripts/prepare-windows-arm64-speech.mjs
      - name: Confirm native module version and packaged notices
        working-directory: apps/desktop
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto"),assert=require("node:assert/strict");const pin=require("./build/windows-arm64-speech.json"),root=path.dirname(require.resolve("sherpa-onnx-node/package.json"));for(const [file,sha] of [["onnxruntime-LICENSE",pin.onnxruntimeLicenseSha256],["onnxruntime-ThirdPartyNotices.txt",pin.onnxruntimeNoticesSha256]]){assert.equal(crypto.createHash("sha256").update(fs.readFileSync(path.join(root,"arm64-notices",file))).digest("hex"),sha);console.log("Verified packaged notice:",file,sha)}const speech=require("sherpa-onnx-node");console.log("Verified native speech:",process.platform,process.arch,speech.version)'
