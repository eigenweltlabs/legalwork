name: LegalWork Tests

on:
  merge_group:
    types: [checks_requested]
    branches: [dev]
  pull_request:
    branches:
      - dev
      - codex/projects-akte-workspace
      - codex/opencode-v2-migration
  workflow_dispatch:
    inputs:
      mac_signing_acceptance:
        description: Only compile, production-sign and execute the three Mac engine targets without publishing
        type: boolean
        default: false
      production_engine:
        description: Use the production-signed source engine for package acceptance without publishing
        type: boolean
        default: false
      package_desktop:
        description: Build and execute desktop and reviewed engine on all six shipped OS/CPU configurations
        type: boolean
        default: false
      unit_acceptance:
        description: Run the full Linux and Mac unit jobs against an exact reused engine; does not validate six-platform packages
        type: boolean
        default: false
      windows_archive_acceptance:
        description: Verify Windows x64 and ARM64 archives, protected engine tools and packaged startup with exact producer reuse
        type: boolean
        default: false
      native_source_acceptance:
        description: Only run all six native host cold-build, real integration and warm-cache engine checks
        type: boolean
        default: false
      transport_diagnostic:
        description: Only compare the full binary transport on Intel Mac under Bun and the production Node runtime
        type: boolean
        default: false
      engine_reuse_run_id:
        description: Optional same-repository producer run ID (requires independent manifest SHA256)
        type: string
        default: ''
      engine_reuse_manifest_sha256:
        description: Independent SHA256 of that producer's complete twelve-target engine manifest
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: legalwork-tests-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance && '-mac-signing' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.package_desktop && !inputs.mac_signing_acceptance && '-package' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.unit_acceptance && !inputs.package_desktop && !inputs.mac_signing_acceptance && '-unit' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.windows_archive_acceptance && !inputs.package_desktop && !inputs.unit_acceptance && !inputs.mac_signing_acceptance && '-windows-archive' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.native_source_acceptance && '-native-source' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && '-transport' || '' }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.app }}
      server: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.server }}
      desktop: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.desktop }}
      tooling: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.tooling }}
      docs: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.docs }}
      engine: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.engine }}
      sandbox: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.sandbox }}
      windows_meetings: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.windows_meetings }}
      windows_drafts: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.windows_drafts }}
      units: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic && 'false' || steps.scope.outputs.units }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope
      - name: Reject contradictory production package inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          TRANSPORT_ONLY: ${{ inputs.transport_diagnostic }}
          PRODUCTION_ENGINE: ${{ inputs.production_engine }}
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          SIGNING_ONLY: ${{ inputs.mac_signing_acceptance }}
          UNIT_ONLY: ${{ inputs.unit_acceptance }}
          WINDOWS_ONLY: ${{ inputs.windows_archive_acceptance }}
          NATIVE_SOURCE_ONLY: ${{ inputs.native_source_acceptance }}
          REUSE_RUN: ${{ inputs.engine_reuse_run_id }}
          REUSE_PIN: ${{ inputs.engine_reuse_manifest_sha256 }}
        run: |
          if [ "$TRANSPORT_ONLY" = true ] && { [ "$PRODUCTION_ENGINE" = true ] || [ "$PACKAGE_DESKTOP" = true ] || [ "$SIGNING_ONLY" = true ] || [ "$UNIT_ONLY" = true ] || [ "$WINDOWS_ONLY" = true ] || [ "$NATIVE_SOURCE_ONLY" = true ] || [ -n "$REUSE_RUN" ] || [ -n "$REUSE_PIN" ]; }; then
            echo 'transport_diagnostic must run alone.' >&2
            exit 1
          fi
          if [ "$NATIVE_SOURCE_ONLY" = true ] && { [ "$PRODUCTION_ENGINE" = true ] || [ "$PACKAGE_DESKTOP" = true ] || [ "$SIGNING_ONLY" = true ] || [ "$UNIT_ONLY" = true ] || [ "$WINDOWS_ONLY" = true ] || [ -n "$REUSE_RUN" ] || [ -n "$REUSE_PIN" ]; }; then
            echo 'native_source_acceptance cannot be combined with production, package, signing, unit, Windows archive or engine reuse inputs.' >&2
            exit 1
          fi
          if [ "$PRODUCTION_ENGINE" = true ] && { [ "$PACKAGE_DESKTOP" != true ] || [ "$SIGNING_ONLY" = true ] || [ "$UNIT_ONLY" = true ] || [ "$WINDOWS_ONLY" = true ] || [ -n "$REUSE_RUN" ] || [ -n "$REUSE_PIN" ]; }; then
            echo 'production_engine requires package_desktop with a fresh source build and no other focused mode.' >&2
            exit 1
          fi
  transport-diagnostic:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.transport_diagnostic
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install-dependencies
        with:
          filter: legalwork-server...
      - run: node apps/desktop/scripts/prepare-node-runtime.mjs
      - run: node scripts/ci/benchmark-transport.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-transport-comparison
          path: ${{ runner.temp }}/legalwork-transport-profile/comparison.json
          if-no-files-found: error
          retention-days: 7
  signing-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance && !inputs.native_source_acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Reject contradictory manual modes
        env:
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          UNIT_ACCEPTANCE: ${{ inputs.unit_acceptance }}
          WINDOWS_ARCHIVE_ACCEPTANCE: ${{ inputs.windows_archive_acceptance }}
        run: |
          if [ "$PACKAGE_DESKTOP" = true ] || [ "$UNIT_ACCEPTANCE" = true ] || [ "$WINDOWS_ARCHIVE_ACCEPTANCE" = true ]; then
            echo 'mac_signing_acceptance cannot be combined with package_desktop, unit_acceptance or windows_archive_acceptance.' >&2
            exit 1
          fi
  unit-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.unit_acceptance && !inputs.native_source_acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Require an exclusive focused mode and exact engine reuse
        env:
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          MAC_SIGNING_ACCEPTANCE: ${{ inputs.mac_signing_acceptance }}
          WINDOWS_ARCHIVE_ACCEPTANCE: ${{ inputs.windows_archive_acceptance }}
          ENGINE_REUSE_RUN_ID: ${{ inputs.engine_reuse_run_id }}
          ENGINE_REUSE_MANIFEST_SHA256: ${{ inputs.engine_reuse_manifest_sha256 }}
        run: |
          if [ "$PACKAGE_DESKTOP" = true ] || [ "$MAC_SIGNING_ACCEPTANCE" = true ] || [ "$WINDOWS_ARCHIVE_ACCEPTANCE" = true ]; then
            echo 'unit_acceptance cannot be combined with package_desktop, mac_signing_acceptance or windows_archive_acceptance.' >&2
            exit 1
          fi
          if [ -z "$ENGINE_REUSE_RUN_ID" ] || [ -z "$ENGINE_REUSE_MANIFEST_SHA256" ]; then
            echo 'unit_acceptance requires an engine producer run and independent manifest SHA256.' >&2
            exit 1
          fi
  windows-archive-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_archive_acceptance && !inputs.native_source_acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Require only Windows archive acceptance and exact engine reuse
        env:
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
          MAC_SIGNING_ACCEPTANCE: ${{ inputs.mac_signing_acceptance }}
          UNIT_ACCEPTANCE: ${{ inputs.unit_acceptance }}
          ENGINE_REUSE_RUN_ID: ${{ inputs.engine_reuse_run_id }}
          ENGINE_REUSE_MANIFEST_SHA256: ${{ inputs.engine_reuse_manifest_sha256 }}
        run: |
          if [ "$PACKAGE_DESKTOP" = true ] || [ "$MAC_SIGNING_ACCEPTANCE" = true ] || [ "$UNIT_ACCEPTANCE" = true ] || [ -z "$ENGINE_REUSE_RUN_ID" ] || [ -z "$ENGINE_REUSE_MANIFEST_SHA256" ]; then
            echo 'windows_archive_acceptance requires exact reuse inputs and cannot be combined with other manual modes.' >&2
            exit 1
          fi
  windows-archive-acceptance:
    needs: [ windows-archive-inputs, opencode-derivative ]
    if: github.event_name == 'workflow_dispatch' && inputs.windows_archive_acceptance && !inputs.native_source_acceptance && needs.windows-archive-inputs.result == 'success' && needs.opencode-derivative.result == 'success'
    uses: ./.github/workflows/ci-windows-opencode-install.yml
    with:
      manifest-sha256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
  windows-protected-runtime:
    needs: [ windows-archive-inputs, changes ]
    if: github.event_name == 'workflow_dispatch' && inputs.windows_archive_acceptance && !inputs.native_source_acceptance && needs.windows-archive-inputs.result == 'success' && needs.changes.result == 'success'
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: win32-x64,win32-arm64
      run_tests: false
  windows-desktop-acceptance:
    needs: [ windows-archive-inputs, opencode-derivative, windows-protected-runtime ]
    if: github.event_name == 'workflow_dispatch' && inputs.windows_archive_acceptance && !inputs.native_source_acceptance && needs.windows-archive-inputs.result == 'success' && needs.opencode-derivative.result == 'success' && needs.windows-protected-runtime.result == 'success'
    uses: ./.github/workflows/ci-desktop-packaging.yml
    with:
      windows-only: true
      derivative-manifest-sha256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
      engine-build-mode: development
  mac-signing-acceptance:
    needs: [ signing-inputs, changes ]
    if: github.event_name == 'workflow_dispatch' && inputs.mac_signing_acceptance && !inputs.unit_acceptance && !inputs.windows_archive_acceptance && !inputs.native_source_acceptance
    uses: ./.github/workflows/mac-engine-signing-acceptance.yml
    secrets:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
  sandbox-guest-x64:
    needs: changes
    if: >-
      github.event_name != 'workflow_dispatch' && needs.changes.outputs.sandbox == 'true' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-sandbox-tests'))
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: linux-x64
      guest_only: true
      run_tests: false
      publish_runtime: false
  sandbox-guest-arm64:
    needs: changes
    if: >-
      github.event_name != 'workflow_dispatch' && needs.changes.outputs.sandbox == 'true' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-sandbox-tests'))
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: linux-arm64
      guest_only: true
      run_tests: false
      publish_runtime: false
  sandbox-runtime:
    needs: changes
    # Maintainers can skip expensive runtime checks for an individual PR.
    # Push, manual and release validation remain unaffected by PR labels.
    if: >-
      github.event_name == 'workflow_dispatch' && needs.changes.outputs.sandbox == 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.mac_signing_acceptance || inputs.unit_acceptance || inputs.windows_archive_acceptance || inputs.native_source_acceptance)) && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-sandbox-tests'))
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      run_tests: false
  engine-source-build:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && needs.changes.result == 'success' && (inputs.native_source_acceptance || (inputs.package_desktop && !inputs.mac_signing_acceptance && !inputs.unit_acceptance && !inputs.windows_archive_acceptance))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-opencode-source-hosts.yml
  opencode-derivative:
    needs: changes
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.engine == 'true' && ( github.event_name != 'workflow_dispatch' || (!inputs.native_source_acceptance && !inputs.mac_signing_acceptance && ((!inputs.unit_acceptance && !inputs.windows_archive_acceptance) || (inputs.unit_acceptance && !inputs.package_desktop && !inputs.windows_archive_acceptance && inputs.engine_reuse_run_id != '' && inputs.engine_reuse_manifest_sha256 != '') || (inputs.windows_archive_acceptance && !inputs.package_desktop && !inputs.unit_acceptance && inputs.engine_reuse_run_id != '' && inputs.engine_reuse_manifest_sha256 != ''))))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-opencode-derivative.yml
    with:
      build-mode: ${{ inputs.production_engine && 'production' || 'development' }}
      reuse-run-id: ${{ inputs.engine_reuse_run_id }}
      reuse-manifest-sha256: ${{ inputs.engine_reuse_manifest_sha256 }}
    secrets:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ inputs.production_engine && secrets.APPLE_CODESIGN_CERT_P12_BASE64 || '' }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ inputs.production_engine && secrets.APPLE_CODESIGN_CERT_PASSWORD || '' }}
  desktop-packaging:
    # Manual package diagnostics may exercise a built runtime after a sandbox
    # assertion fails. The failed sandbox workflow still keeps the run red.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.package_desktop && !inputs.mac_signing_acceptance && !inputs.unit_acceptance && !inputs.windows_archive_acceptance && needs.opencode-derivative.result == 'success' && (needs.sandbox-runtime.result == 'success' || needs.sandbox-runtime.result == 'failure')
    needs: [ sandbox-runtime, opencode-derivative ]
    uses: ./.github/workflows/ci-desktop-packaging.yml
    with:
      derivative-manifest-sha256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
      engine-build-mode: ${{ inputs.production_engine && 'production' || 'development' }}
  windows-meetings:
    needs: changes
    if: needs.changes.outputs.windows_meetings == 'true' && (github.event_name != 'workflow_dispatch' || (!inputs.mac_signing_acceptance && !inputs.unit_acceptance && !inputs.windows_archive_acceptance && !inputs.native_source_acceptance))
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Test Windows meeting detection and native metadata helper
        run: node --test apps/desktop/electron/windows-meeting-probe.test.mjs apps/desktop/electron/meeting-monitor.test.mjs

  windows-drafts:
    needs: changes
    if: needs.changes.outputs.windows_drafts == 'true' && (github.event_name != 'workflow_dispatch' || (!inputs.mac_signing_acceptance && !inputs.unit_acceptance && !inputs.windows_archive_acceptance && !inputs.native_source_acceptance))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: ./.github/actions/install-dependencies
        with:
          ignore-scripts: "true"
      - name: Verify bundled help generation on Windows
        run: node --test scripts/gen-core-skills.test.mjs
      - name: Test portable drafts
        run: pnpm test:drafts
      - name: Test Windows Outlook handoff
        run: node --test apps/desktop/electron/mail-draft.test.mjs
      - name: Test detailed support exports on Windows
        run: node --test apps/desktop/electron/technical-support-bundle.test.mjs
      - name: Test packaged server archive imports on Windows
        run: node --test apps/desktop/electron/packaged-server-deps.test.mjs
      - name: Test Windows signing verification
        run: node --test scripts/release/windows-signing.test.mjs

  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'workflow_dispatch' || (!inputs.mac_signing_acceptance && !inputs.windows_archive_acceptance && !inputs.native_source_acceptance))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: ./.github/actions/install-dependencies
        with:
          ignore-scripts: "true"
      - run: node --test scripts/gen-core-skills.test.mjs
      - run: pnpm docs:check
  pr-renderer:
    needs: changes
    if: >-
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.mac_signing_acceptance || inputs.windows_archive_acceptance || inputs.native_source_acceptance))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install-dependencies
        with:
          filter: '@legalwork/app...'
      - name: Build UI for unsaved-change Electron checks
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node scripts/gen-core-skills.mjs
          pnpm --filter @legalwork/app build
          node scripts/ci/portable-assets.mjs seal renderer
      - uses: actions/upload-artifact@v4
        with:
          name: pr-renderer
          path: |
            apps/app/dist/
            apps/app/portable-ui-receipt.json
          if-no-files-found: error
          retention-days: 7
  unit-tests:
    needs: [ changes, pr-renderer ]
    # No engine installation here: real-engine fixtures run in the gated job.
    env:
      LEGALWORK_TEST_OPENCODE_BIN: ''
      LEGALWORK_TEST_OPENCODE_CACHE: ''
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.units == 'true' && (needs.pr-renderer.result == 'success' || needs.pr-renderer.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && (inputs.mac_signing_acceptance || inputs.windows_archive_acceptance || inputs.native_source_acceptance))
    # Keep historical required check names while using the supported runner.
    runs-on: ${{ matrix.os == 'macos-14' && 'macos-15' || matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-14 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Reserve fixed sign-in ports from Linux ephemeral allocation
        if: runner.os == 'Linux' && needs.changes.outputs.server == 'true'
        run: |
          reserved="$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}43117-43119"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Prepare checksum-pinned Node for worker tests
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.desktop == 'true'
        run: node apps/desktop/scripts/prepare-node-runtime.mjs

      - name: Typecheck app
        if: (runner.os == 'Linux') && (needs.changes.outputs.app == 'true')
        run: pnpm --filter @legalwork/app typecheck

      - name: Build server and native plugins
        if: needs.changes.outputs.engine == 'true'
        run: pnpm --filter legalwork-server build

      - name: Check packaged OpenCode plugins are self-contained
        if: (runner.os == 'Linux') && (needs.changes.outputs.engine == 'true')
        run: node apps/desktop/scripts/check-plugin-bundles.mjs apps/server/dist/opencode-plugins

      - name: Run app unit tests
        if: needs.changes.outputs.app == 'true'
        run: pnpm --filter @legalwork/app test

      - uses: actions/download-artifact@v4
        if: (runner.os == 'macOS') && (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true')
        with:
          name: pr-renderer
          path: apps/app
      - name: Verify exact renderer source, settings and output hashes
        if: (runner.os == 'macOS') && (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true')
        run: node scripts/ci/portable-assets.mjs verify renderer

      - name: Verify workflow editing and close/restart decisions in Electron
        if: (runner.os == 'macOS') && (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true')
        env:
          LEGALWORK_SHUTDOWN_TEST_OUTPUT: ${{ runner.temp }}/unsaved-shutdown
          LEGALWORK_EDITOR_TEST_OUTPUT: ${{ runner.temp }}/workflow-editor
        run: |
          pnpm --filter @legalwork/desktop test:workflow-editor
          pnpm --filter @legalwork/desktop test:shutdown
          pnpm --filter @legalwork/desktop test:updater-quit

      - name: Upload unsaved-change Electron evidence
        if: always() && (runner.os == 'macOS') && (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-change-electron-evidence
          path: |
            ${{ runner.temp }}/unsaved-shutdown
            ${{ runner.temp }}/workflow-editor

      - name: Verify saved-login suggestions in Electron
        if: (runner.os == 'macOS') && (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true')
        env:
          LEGALWORK_AUTOFILL_TEST_OUTPUT: ${{ runner.temp }}/browser-autofill
        run: pnpm --filter @legalwork/desktop test:browser-autofill

      - name: Upload browser autofill evidence
        if: always() && (runner.os == 'macOS') && (needs.changes.outputs.app == 'true' || needs.changes.outputs.desktop == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: browser-autofill-evidence
          path: ${{ runner.temp }}/browser-autofill

      - name: Verify engine source policy, preparation and immutable artifacts
        if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.tooling == 'true'
        run: node --test packages/opencode-release/*.test.mjs packages/opencode-release/build/*.test.mjs

      - name: Verify retired downloads and complete local CLI bundles
        if: needs.changes.outputs.server == 'true'
        run: bun test apps/orchestrator/src/retired-binary-downloads.test.mjs

      - name: Verify synthetic startup failure diagnostics
        if: needs.changes.outputs.desktop == 'true'
        run: node --test apps/desktop/scripts/packaged-startup-diagnostics.test.mjs

      - name: Verify recorder capture and dictation
        if: needs.changes.outputs.app == 'true'
        run: |
          pnpm --filter @legalwork/app test:recorder-capture
          pnpm --filter @legalwork/app test:dictation

      - name: Run server unit tests
        if: needs.changes.outputs.server == 'true'
        run: pnpm --filter legalwork-server test

      - name: Verify built draft routes load in Node
        if: needs.changes.outputs.server == 'true'
        run: pnpm test:drafts:build

      - name: Verify report source evidence checks
        if: needs.changes.outputs.server == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/legalwork-report-tests"
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" -I -S apps/server/resources/agent-sandbox/bootstrap-pip.py
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" -m pip install python-docx==1.2.0
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" apps/server/scripts/test-report-evidence.py
          "$RUNNER_TEMP/legalwork-report-tests/bin/python" apps/server/scripts/test-report-from-reviews.py

      - name: Run release tooling tests
        if: needs.changes.outputs.tooling == 'true'
        run: node --test scripts/release/*.test.mjs scripts/ci/*.test.mjs

      - name: Typecheck Electron main against the IPC contract
        if: needs.changes.outputs.desktop == 'true'
        run: pnpm --filter @legalwork/desktop typecheck:electron
      - name: Upload CI operation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ci-spans.jsonl
          if-no-files-found: ignore
          retention-days: 7

  sandbox-validation-darwin-x64:
    name: sandbox-validation (macos-15-intel, darwin, x64)
    needs: [ sandbox-guest-x64, sandbox-runtime ]
    if: >-
      always() && !cancelled() && (needs.sandbox-guest-x64.result == 'success' || needs.sandbox-runtime.result == 'success')
    uses: ./.github/workflows/ci-sandbox-validation.yml
    with:
      os: macos-15-intel
      platform: darwin
      arch: x64
      runtime-artifact: ${{ needs.sandbox-runtime.result == 'success' }}

  sandbox-validation-win32-x64:
    name: sandbox-validation (windows-2022, win32, x64)
    needs: [ sandbox-guest-x64, sandbox-runtime ]
    if: >-
      always() && !cancelled() && (needs.sandbox-guest-x64.result == 'success' || needs.sandbox-runtime.result == 'success')
    uses: ./.github/workflows/ci-sandbox-validation.yml
    with:
      os: windows-2022
      platform: win32
      arch: x64
      runtime-artifact: ${{ needs.sandbox-runtime.result == 'success' }}

  sandbox-validation-win32-arm64:
    name: sandbox-validation (windows-11-arm, win32, arm64)
    needs: [ sandbox-guest-arm64, sandbox-runtime ]
    if: >-
      always() && !cancelled() && (needs.sandbox-guest-arm64.result == 'success' || needs.sandbox-runtime.result == 'success')
    uses: ./.github/workflows/ci-sandbox-validation.yml
    with:
      os: windows-11-arm
      platform: win32
      arch: arm64
      dependency-cache: false
      runtime-artifact: ${{ needs.sandbox-runtime.result == 'success' }}

  sandbox-validation-linux-arm64:
    name: sandbox-validation (ubuntu-24.04-arm, linux, arm64)
    needs: [ sandbox-guest-arm64, sandbox-runtime ]
    if: >-
      always() && !cancelled() && (needs.sandbox-guest-arm64.result == 'success' || needs.sandbox-runtime.result == 'success')
    uses: ./.github/workflows/ci-sandbox-validation.yml
    with:
      os: ubuntu-24.04-arm
      platform: linux
      arch: arm64
      runtime-artifact: ${{ needs.sandbox-runtime.result == 'success' }}

  ci-result:
    name: Selected checks passed
    if: always()
    needs:
      - changes
      - signing-inputs
      - unit-inputs
      - transport-diagnostic
      - windows-archive-inputs
      - windows-archive-acceptance
      - windows-protected-runtime
      - windows-desktop-acceptance
      - mac-signing-acceptance
      - sandbox-runtime
      - sandbox-guest-x64
      - sandbox-guest-arm64
      - engine-source-build
      - opencode-derivative
      - desktop-packaging
      - windows-meetings
      - windows-drafts
      - documentation
      - pr-renderer
      - unit-tests
      - sandbox-validation-darwin-x64
      - sandbox-validation-win32-x64
      - sandbox-validation-win32-arm64
      - sandbox-validation-linux-arm64
      - engine-runtime-linux
      - engine-tests-linux
      - engine-tests-mac
      - legalwork-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); const failed = Object.entries(jobs).filter(([, job]) => !["success", "skipped"].includes(job.result)); if (failed.length) { console.error(failed); process.exit(1); }'
  engine-runtime-linux:
    needs: sandbox-guest-x64
    if: always() && !cancelled() && needs.sandbox-guest-x64.result == 'success'
    uses: ./.github/workflows/ci-prepare-engine-runtime.yml
    with:
      os: ubuntu-24.04
      arch: x64
  engine-tests-linux:
    name: engine-tests (ubuntu-latest)
    needs: [ changes, opencode-derivative, sandbox-guest-x64, sandbox-runtime, engine-runtime-linux ]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.engine == 'true' && (needs.engine-runtime-linux.result == 'success' || needs.engine-runtime-linux.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && (inputs.mac_signing_acceptance || inputs.windows_archive_acceptance || inputs.native_source_acceptance))
    uses: ./.github/workflows/ci-engine-tests.yml
    with:
      os: ubuntu-24.04
      arch: x64
      engine-workers: 4
      engine-required: ${{ needs.changes.outputs.engine == 'true' }}
      engine-result: ${{ needs.opencode-derivative.result }}
      manifest-sha256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
      app: ${{ needs.changes.outputs.app == 'true' }}
      server: ${{ needs.changes.outputs.server == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      runtime-required: ${{ needs.sandbox-guest-x64.result == 'success' || needs.sandbox-runtime.result == 'success' }}
      runtime-artifact: ${{ needs.sandbox-runtime.result == 'success' || needs.engine-runtime-linux.result == 'success' }}
      production-engine: ${{ inputs.production_engine == true }}
  engine-tests-mac:
    name: engine-tests (macos-14)
    needs: [ changes, opencode-derivative, sandbox-guest-arm64, sandbox-runtime ]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.engine == 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.mac_signing_acceptance || inputs.windows_archive_acceptance || inputs.native_source_acceptance))
    uses: ./.github/workflows/ci-engine-tests.yml
    with:
      os: macos-15
      arch: arm64
      engine-workers: 2
      engine-required: ${{ needs.changes.outputs.engine == 'true' }}
      engine-result: ${{ needs.opencode-derivative.result }}
      manifest-sha256: ${{ needs.opencode-derivative.outputs.manifest-sha256 }}
      app: ${{ needs.changes.outputs.app == 'true' }}
      server: ${{ needs.changes.outputs.server == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      runtime-required: ${{ needs.sandbox-guest-arm64.result == 'success' || needs.sandbox-runtime.result == 'success' }}
      runtime-artifact: ${{ needs.sandbox-runtime.result == 'success' }}
      production-engine: ${{ inputs.production_engine == true }}
  legalwork-tests:
    name: legalwork-tests (${{ matrix.os }})
    needs:
      - changes
      - signing-inputs
      - unit-inputs
      - transport-diagnostic
      - windows-archive-inputs
      - windows-archive-acceptance
      - windows-protected-runtime
      - windows-desktop-acceptance
      - mac-signing-acceptance
      - sandbox-runtime
      - sandbox-guest-x64
      - sandbox-guest-arm64
      - engine-source-build
      - opencode-derivative
      - desktop-packaging
      - windows-meetings
      - windows-drafts
      - documentation
      - pr-renderer
      - unit-tests
      - sandbox-validation-darwin-x64
      - sandbox-validation-win32-x64
      - sandbox-validation-win32-arm64
      - sandbox-validation-linux-arm64
      - engine-runtime-linux
      - engine-tests-linux
      - engine-tests-mac
    if: always()
    # These preserve historical required names and only aggregate outcomes.
    # Native Mac tests above run on Mac; a metadata gate needs no Mac runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); const failed = Object.entries(jobs).filter(([, job]) => !["success", "skipped"].includes(job.result)); if (failed.length) { console.error(failed); process.exit(1); }'
env:
  LEGALWORK_TEST_WORKERS: "2"
