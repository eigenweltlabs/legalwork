name: Prepare the engine host's protected runtime
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      arch:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: ./.github/actions/prepare-sandbox-runtime
        with:
          arch: ${{ inputs.arch }}
          qemu: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
