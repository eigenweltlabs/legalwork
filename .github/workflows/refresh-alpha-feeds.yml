name: Refresh alpha update feeds

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_run:
    workflows: ["Alpha Channel (macOS arm64)", "Alpha Channel (Windows x64 + ARM64)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# A single writer recomputes the newest versions after builds or manual label
# edits. Replacing a pending invocation is safe: each scan includes all releases.
concurrency:
  group: legalwork-alpha-feed-publication
  cancel-in-progress: false

jobs:
  publication:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.published.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: published
        with:
          script: |
            if (context.eventName !== 'workflow_run') return true;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            return jobs.some(job => job.name.startsWith('Build + Publish alpha (') && job.conclusion === 'success');
  refresh:
    needs: publication
    if: needs.publication.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run must execute trusted default-branch tooling, never code
      # from the triggering workflow's branch or downloaded build artifacts.
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select and pin the newest eligible alpha feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/refresh-alpha-feeds.mjs
