name: Mail signed macOS lifecycle qualification (NONPUBLISHING)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      QUALIFICATION_SOURCE: 5060005ed
      TARGET: ${{ matrix.target }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate qualification assertions
        run: node --test scripts/mail/signed-qualification/policy.test.mjs
      - name: Add temporary probe and loopback-only feeds before signing
        run: |
          git diff --exit-code "$QUALIFICATION_SOURCE" -- apps packages scripts/release
          node scripts/mail/signed-qualification/prepare.mjs
          mkdir -p "$RUNNER_TEMP/mail-signed-evidence"
          git diff -- apps/desktop/electron/main.mjs apps/desktop/electron/updater.mjs > "$RUNNER_TEMP/mail-signed-evidence/instrumentation.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/mail-signed-evidence/qualification-commit.txt"
          git rev-parse "$QUALIFICATION_SOURCE" > "$RUNNER_TEMP/mail-signed-evidence/product-source.txt"
      - name: Build current desktop once
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Write temporary notary API key
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Package two private qualification versions with production signing hooks
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: 'true'
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          QUALIFICATION_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for phase in base target; do
            version=0.0.1
            if [ "$phase" = target ]; then version=0.0.2; fi
            output="$RUNNER_TEMP/mail-signed-artifacts/$phase"
            pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml \
              --mac dmg zip --"$QUALIFICATION_ARCH" --publish never \
              -c.extraMetadata.version="$version" -c.directories.output="$output"
            # Existing afterSign notarizes/staples the app. Also notarize the
            # nonpublished DMG envelope used by the installation probe.
            for dmg in "$output"/*.dmg; do
              xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
                --wait --output-format json > "$RUNNER_TEMP/mail-signed-evidence/$phase-dmg-notary.json"
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
            done
          done
      - name: Actual signed DMG install, Squirrel update, uninstall and retained-data reinstall
        timeout-minutes: 20
        run: node scripts/mail/signed-qualification/lifecycle.mjs "$RUNNER_TEMP/mail-signed-artifacts" "$RUNNER_TEMP/mail-signed-evidence"
      - name: Remove temporary notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Retain metadata only; never profiles, keys or application artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-signed-lifecycle-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mail-signed-evidence/*.json
            ${{ runner.temp }}/mail-signed-evidence/*.txt
            ${{ runner.temp }}/mail-signed-evidence/*.patch
          retention-days: 7
