name: Alpha Channel (macOS + Windows)

# Each dev merge affecting the app builds an alpha. Required PR checks
# already ran before merge; packaging does not rerun the sandbox suite.
on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      sandbox_tests:
        description: Run sandbox validation tests (manual opt-in only)
        type: boolean
        default: false
      signing_test:
        description: Validate Azure signing without publishing
        type: boolean
        default: false
      benchmark_profile:
        description: Controlled nonpublishing comparison on the same source
        type: choice
        options: [optimized, serial-full-ui]
        default: optimized
      benchmark_version:
        description: Optional identical prerelease version for both nonpublishing samples
        type: string
        default: ''
      linux_benchmark:
        description: Compare Linux archive compression on identical packaged bytes without publishing
        type: boolean
        default: false
      warm_engine_cache:
        description: Prepare only the verified production engine cache without publishing
        type: boolean
        default: false
      require_engine_cache:
        description: Require a verified production cache hit for a full nonpublishing benchmark
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: legalwork-alpha-${{ github.event_name == 'workflow_dispatch' && inputs.signing_test && format('benchmark-{0}', github.ref) || 'dev' }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      alpha: ${{ steps.scope.outputs.alpha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope
      - name: Require benchmark inputs to be nonpublishing
        if: github.event_name == 'workflow_dispatch'
        env:
          SIGNING_TEST: ${{ inputs.signing_test }}
          PROFILE: ${{ inputs.benchmark_profile }}
          VERSION: ${{ inputs.benchmark_version }}
          LINUX_BENCHMARK: ${{ inputs.linux_benchmark }}
          WARM_ENGINE_CACHE: ${{ inputs.warm_engine_cache }}
          REQUIRE_ENGINE_CACHE: ${{ inputs.require_engine_cache }}
        run: |
          if { [ "$PROFILE" = serial-full-ui ] || [ -n "$VERSION" ] || [ "$LINUX_BENCHMARK" = true ] || [ "$WARM_ENGINE_CACHE" = true ] || [ "$REQUIRE_ENGINE_CACHE" = true ]; } && [ "$SIGNING_TEST" != true ]; then
            echo 'Benchmark profiles and versions require signing_test; publishing must be disabled.' >&2
            exit 1
          fi
          if [ "$REQUIRE_ENGINE_CACHE" = true ] && { [ "$PROFILE" = serial-full-ui ] || [ "$WARM_ENGINE_CACHE" = true ]; }; then
            echo 'A full cache-hit benchmark cannot select a cold profile or engine-only warm-up.' >&2
            exit 1
          fi
  opencode-engine:
    needs: changes
    if: needs.changes.outputs.alpha == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-opencode-derivative.yml
    with:
      build-mode: production
      ref: ${{ github.sha }}
      build-workers: ${{ inputs.benchmark_profile == 'serial-full-ui' && 1 || 2 }}
      force-production-rebuild: ${{ inputs.benchmark_profile == 'serial-full-ui' }}
      require-production-cache-hit: ${{ github.event_name == 'workflow_dispatch' && inputs.require_engine_cache || false }}
    secrets:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
  sandbox-runtime:
    needs: changes
    if: needs.changes.outputs.alpha == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.warm_engine_cache)
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: ${{ inputs.linux_benchmark && 'darwin-arm64,win32-x64,win32-arm64,linux-x64,linux-arm64' || 'darwin-arm64,win32-x64,win32-arm64' }}
      run_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox_tests || false }}
  publish-alpha-macos-aarch64:
    needs: [ sandbox-runtime, opencode-engine, portable-assets, portable-version ]
    name: Build + Publish alpha (aarch64-apple-darwin)
    runs-on: macos-15
    timeout-minutes: 180

    env:
      ALPHA_RELEASE_TAG: alpha-macos-latest
      ALPHA_RELEASE_NAME: LegalWork Alpha (macOS arm64)
      # Apple signing + notarization are required so alpha bundles install
      # and launch without Gatekeeper friction. Alpha builds are served
      # from GitHub Releases like stable, just from a different tag.
      MACOS_NOTARIZE: ${{ vars.MACOS_NOTARIZE || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full history so `git describe` can find the latest v* release tag —
          # alpha versions are derived from it (package.json is a placeholder).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Download the same-run source-built engine
        uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci-${{ runner.os }}
          path: ${{ runner.temp }}/opencode-derivative
      - name: Verify and prepare the production engine
        uses: ./.github/actions/setup-opencode
        with:
          build-mode: production
          archive-directory: ${{ runner.temp }}/opencode-derivative/archives
          manifest-sha256: ${{ needs.opencode-engine.outputs.manifest-sha256 }}
          archive-family: "true"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          cache: ${{ runner.os != 'Windows' || runner.arch != 'ARM64' || inputs.benchmark_profile == 'serial-full-ui' }}
          filter: |
            ${{ inputs.benchmark_profile == 'serial-full-ui' && '*' || '@legalwork/desktop...' }}
            ${{ inputs.benchmark_profile == 'serial-full-ui' && '' || 'legalwork-orchestrator...' }}
            ${{ inputs.benchmark_profile == 'serial-full-ui' && '' || '@legalwork/actaport-mcp...' }}

      - name: Resolve alpha version
        id: alpha-version
        shell: bash
        env:
          ALPHA_VERSION: ${{ needs.portable-version.outputs.version }}
        run: |
          set -euo pipefail
          base="${ALPHA_VERSION%%-alpha.*}"
          sha="${GITHUB_SHA:0:7}"
          echo "alpha_version=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$base" >> "$GITHUB_OUTPUT"
          echo "release_tag=alpha-macos-v${base}-alpha.${GITHUB_RUN_NUMBER}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Stamp alpha version
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        # Lockfile-only resync keeps pnpm-lock.yaml consistent with the stamped
        # orchestrator dependency pins so later pnpm invocations don't reject
        # the workspace (installs stay explicit + frozen before this step).
        run: |
          node scripts/release/apply-version.mjs --version "$ALPHA_VERSION"
          pnpm install --lockfile-only --no-frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-darwin-arm64
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          tar -xzf "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz" -C apps/server/resources/agent-sandbox/runtime

      - name: Write notary API key
        if: env.MACOS_NOTARIZE == 'true'
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
      - name: Download verified portable desktop assets
        uses: actions/download-artifact@v4
        with:
          name: portable-desktop-assets
          path: apps/app

      - name: Build Electron alpha app
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
          # The renderer bundle (vite build) peaks above Node's default heap
          # since the editors and media viewers joined it; the 7 GB runner has
          # room for this.
          NODE_OPTIONS: --max-old-space-size=6144
          LEGALWORK_PREBUILT_UI: ${{ inputs.benchmark_profile == 'serial-full-ui' && '0' || '1' }}
        run: pnpm --filter @legalwork/desktop build:electron:production

      - name: Package Electron alpha (macOS, signed + notarized)
        if: env.MACOS_NOTARIZE == 'true'
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '6'
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: true
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --mac \
            --arm64 \
            --publish never

      - name: Package Electron alpha (macOS, ad-hoc signed)
        if: env.MACOS_NOTARIZE != 'true'
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '6'
          # No Apple cert/notary secrets -> ad-hoc sign (mac.identity=-) so
          # Gatekeeper shows "developer cannot be verified -> Open Anyway"
          # instead of "damaged". disable-library-validation is already set in
          # build/entitlements.mac.plist, so the hardened runtime can stay on.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          echo "MACOS_NOTARIZE != 'true' -> ad-hoc signing macOS arm64 alpha."
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            -c.mac.identity=- \
            --mac \
            --arm64 \
            --publish never

      - name: Verify packaged startup
        timeout-minutes: 3
        run: node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/mac-arm64/LegalWork.app/Contents/MacOS/LegalWork"

      - name: Create immutable alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          body="Rolling alpha build for LegalWork (macOS arm64) from ${GITHUB_SHA}."
          if gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Alpha prerelease $ALPHA_RUN_RELEASE_TAG already exists; reusing it."
            exit 0
          fi
          gh release create "$ALPHA_RUN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LegalWork Alpha ${ALPHA_VERSION}" \
            --notes "$body" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --draft
        if: ${{ !inputs.signing_test }}

      - name: Upload Electron alpha updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          if [ "$(jq -r .targetCommitish <<<"$release")" != "$GITHUB_SHA" ]; then
            echo "Existing alpha points at a different source commit" >&2
            exit 1
          fi
          if [ "$(jq -r .isDraft <<<"$release")" != true ]; then
            echo "Alpha is already published; preserve its immutable artifacts."
            exit 0
          fi
          shopt -s nullglob
          assets=(
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest-mac.yml
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Electron alpha assets found in apps/desktop/dist-electron" >&2
            exit 1
          fi
          gh release upload "$ALPHA_RUN_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        if: ${{ !inputs.signing_test }}

      - name: Publish complete alpha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          if [ "$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --tag "$ALPHA_RUN_RELEASE_TAG" --target "$GITHUB_SHA" --draft=false --prerelease --latest=false
          fi
        if: ${{ !inputs.signing_test }}
      - name: Retain redacted startup failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-startup-failure-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/.test-artifacts/packaged-startup/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload CI operation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ci-spans.jsonl
          if-no-files-found: ignore
          retention-days: 7
  publish-alpha-windows:
    needs: [ sandbox-runtime, opencode-engine, portable-version, portable-assets ]
    environment: windows-signing
    permissions:
      actions: read
      contents: write
      id-token: write
    name: Build + Publish alpha (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
            manifest: latest.yml
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            manifest: latest-arm64.yml
    timeout-minutes: 180

    env:
      ALPHA_RELEASE_TAG: alpha-windows-latest
      ALPHA_RELEASE_NAME: LegalWork Alpha (Windows)
      ALPHA_ARCH: ${{ matrix.arch }}
      UPDATER_MANIFEST: ${{ matrix.manifest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full history so `git describe` can find the latest v* release tag —
          # alpha versions are derived from it (package.json is a placeholder).
          fetch-depth: 0

      - name: Enable git long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Download the same-run source-built engine
        uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci-${{ runner.os }}
          path: ${{ runner.temp }}/opencode-derivative
      - name: Verify and prepare the production engine
        uses: ./.github/actions/setup-opencode
        with:
          build-mode: production
          archive-directory: ${{ runner.temp }}/opencode-derivative/archives
          manifest-sha256: ${{ needs.opencode-engine.outputs.manifest-sha256 }}
          archive-family: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          cache: ${{ runner.os != 'Windows' || runner.arch != 'ARM64' || inputs.benchmark_profile == 'serial-full-ui' }}
          filter: |
            ${{ inputs.benchmark_profile == 'serial-full-ui' && '*' || '@legalwork/desktop...' }}
            ${{ inputs.benchmark_profile == 'serial-full-ui' && '' || 'legalwork-orchestrator...' }}
            ${{ inputs.benchmark_profile == 'serial-full-ui' && '' || '@legalwork/actaport-mcp...' }}

      - uses: ./.github/actions/prepare-windows-arm64-speech
        if: runner.arch == 'ARM64'

      - name: Resolve alpha version
        id: alpha-version
        shell: bash
        env:
          ALPHA_VERSION: ${{ needs.portable-version.outputs.version }}
        run: |
          set -euo pipefail
          base="${ALPHA_VERSION%%-alpha.*}"
          sha="${GITHUB_SHA:0:7}"
          echo "alpha_version=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$base" >> "$GITHUB_OUTPUT"
          echo "release_tag=alpha-windows-${ALPHA_ARCH}-v${base}-alpha.${GITHUB_RUN_NUMBER}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Stamp alpha version
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        # Lockfile-only resync keeps pnpm-lock.yaml consistent with the stamped
        # orchestrator dependency pins so later pnpm invocations don't reject
        # the workspace (installs stay explicit + frozen before this step).
        run: |
          node scripts/release/apply-version.mjs --version "$ALPHA_VERSION"
          pnpm install --lockfile-only --no-frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-win32-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$(cygpath -u "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz")"
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime
      - name: Download verified portable desktop assets
        uses: actions/download-artifact@v4
        with:
          name: portable-desktop-assets
          path: apps/app

      - name: Build Electron alpha app
        shell: bash
        env:
          # TARGET tells prepare-sidecar.mjs which architecture's sidecars
          # to download.
          TARGET: ${{ matrix.target }}
          # The renderer bundle (vite build) peaks above Node's default heap.
          NODE_OPTIONS: --max-old-space-size=6144
          LEGALWORK_PREBUILT_UI: ${{ inputs.benchmark_profile == 'serial-full-ui' && '0' || '1' }}
        run: pnpm --filter @legalwork/desktop build:electron:production

      # Authenticate after the long build so the Azure CLI token is fresh.
      - name: Sign in to Azure signing
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package Electron alpha (Windows)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.azure.yml \
            --win --${{ matrix.arch }} \
            --publish never

      - name: Verify signed Windows artifacts
        shell: pwsh
        run: |
          $appDir = if ($env:ALPHA_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          ./scripts/release/verify-windows-signature.ps1 -ArtifactDirectory "apps/desktop/dist-electron" -AppExecutable "apps/desktop/dist-electron/$appDir/LegalWork.exe"

      - name: Verify packaged startup
        timeout-minutes: 3
        shell: pwsh
        run: |
          $appDir = if ($env:ALPHA_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/$appDir/LegalWork.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Separate Windows ARM64 updater feed
        if: matrix.arch == 'arm64'
        shell: bash
        run: mv apps/desktop/dist-electron/latest.yml apps/desktop/dist-electron/latest-arm64.yml

      - name: Create immutable alpha prerelease
        if: ${{ !inputs.signing_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          printf -v body '%s\n\n%s' \
            "Rolling alpha build for LegalWork (Windows ${ALPHA_ARCH}) from ${GITHUB_SHA}." \
            "[Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CODE_SIGNING_POLICY.md)"
          if gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Alpha prerelease $ALPHA_RUN_RELEASE_TAG already exists; reusing it."
            exit 0
          fi
          gh release create "$ALPHA_RUN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LegalWork Alpha ${ALPHA_VERSION} (Windows ${ALPHA_ARCH})" \
            --notes "$body" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --draft

      - name: Upload Electron alpha updater assets
        if: ${{ !inputs.signing_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          if [ "$(jq -r .targetCommitish <<<"$release")" != "$GITHUB_SHA" ]; then
            echo "Existing alpha points at a different source commit" >&2
            exit 1
          fi
          if [ "$(jq -r .isDraft <<<"$release")" != true ]; then
            echo "Alpha is already published; preserve its immutable artifacts."
            exit 0
          fi
          shopt -s nullglob
          assets=(
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/"$UPDATER_MANIFEST"
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Electron alpha assets found in apps/desktop/dist-electron" >&2
            exit 1
          fi
          gh release upload "$ALPHA_RUN_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish complete alpha
        if: ${{ !inputs.signing_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          if [ "$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --tag "$ALPHA_RUN_RELEASE_TAG" --target "$GITHUB_SHA" --draft=false --prerelease --latest=false
          fi

      - name: Upload signed Windows test artifacts
        if: inputs.signing_test
        uses: actions/upload-artifact@v4
        with:
          name: azure-signing-test-windows-${{ matrix.arch }}
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 7
      - name: Retain redacted startup failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-startup-failure-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/.test-artifacts/packaged-startup/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload CI operation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ci-spans.jsonl
          if-no-files-found: ignore
          retention-days: 7
  portable-version:
    needs: changes
    if: needs.changes.outputs.alpha == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.warm_engine_cache)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          BENCHMARK_VERSION: ${{ inputs.benchmark_version }}
        run: |
          if [ -n "$BENCHMARK_VERSION" ]; then
            [[ "$BENCHMARK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+\.g[0-9a-f]{7}$ ]]
            [[ "$BENCHMARK_VERSION" == *".g${GITHUB_SHA:0:7}" ]]
            echo "version=$BENCHMARK_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(git describe --tags --match 'v*' --abbrev=0)
          base="${tag#v}"
          base="${base%%[-+]*}"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r major minor patch <<< "$base"
          echo "version=${major}.${minor}.$((patch+1))-alpha.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
  portable-assets:
    needs: portable-version
    uses: ./.github/workflows/ci-portable-assets.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.portable-version.outputs.version }}

  linux-packaging-benchmark:
    needs: [ sandbox-runtime, opencode-engine, portable-version, portable-assets ]
    if: github.event_name == 'workflow_dispatch' && inputs.signing_test && inputs.linux_benchmark
    uses: ./.github/workflows/ci-linux-packaging-benchmark.yml
    with:
      version: ${{ needs.portable-version.outputs.version }}
      manifest-sha256: ${{ needs.opencode-engine.outputs.manifest-sha256 }}
