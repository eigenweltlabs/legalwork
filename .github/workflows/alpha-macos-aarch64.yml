name: Alpha Channel (macOS arm64)

# Dispatch this workflow manually (Actions tab) to publish a fresh macOS arm64
# build to the LegalWork alpha release channel.
#
# The alpha channel is macOS-only today. It lives as a rolling GitHub
# release. Each run also updates a small manifest on the fixed
# `alpha-macos-latest` release so the Electron updater feed stays stable while
# historical alpha artifacts remain available.
#
# See:
#   - ARCHITECTURE.md#release-channels
#   - .github/workflows/release-macos-aarch64.yml (stable channel)

on:
  # Manual-only: dispatch from the GitHub Actions tab to publish a macOS arm64
  # alpha build to the rolling alpha-macos-latest release. Builds are unsigned
  # until Apple signing secrets are added + MACOS_NOTARIZE=true (see the
  # signed/unsigned package steps below).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-macos-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-alpha-macos-aarch64:
    name: Build + Publish alpha (aarch64-apple-darwin)
    runs-on: macos-14
    timeout-minutes: 180

    env:
      ALPHA_RELEASE_TAG: alpha-macos-latest
      ALPHA_RELEASE_NAME: LegalWork Alpha (macOS arm64)
      # Apple signing + notarization are required so alpha bundles install
      # and launch without Gatekeeper friction. Alpha builds are served
      # from GitHub Releases like stable, just from a different tag.
      MACOS_NOTARIZE: ${{ vars.MACOS_NOTARIZE || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full history so `git describe` can find the latest v* release tag —
          # alpha versions are derived from it (package.json is a placeholder).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: macos-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            macos-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve alpha version
        id: alpha-version
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The latest v* tag reachable from this commit is the version source
          # of truth (package.json only carries a 0.0.0 placeholder). Alpha
          # builds advertise the *next* patch version so semver comparison
          # makes the alpha newer than the current stable (e.g. stable
          # 0.11.207 < alpha 0.11.208-alpha.<run>). Once stable 0.11.208
          # ships, its semver beats the alpha prerelease tag and alpha users
          # cleanly migrate forward.
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
          base="${latest_tag#v}"
          base="${base%%[-+]*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $latest_tag" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$base"
          next_patch=$((patch + 1))
          run="${GITHUB_RUN_NUMBER:-0}"
          sha="${GITHUB_SHA:0:7}"
          sha="${sha:-local}"
          echo "Latest release tag: $latest_tag -> alpha base ${major}.${minor}.${next_patch}"
          {
            echo "alpha_version=${major}.${minor}.${next_patch}-alpha.${run}+${sha}"
            echo "base_version=${major}.${minor}.${next_patch}"
            echo "release_tag=alpha-macos-v${major}.${minor}.${next_patch}-alpha.${run}-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp alpha version
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        run: node scripts/release/apply-version.mjs --version "$ALPHA_VERSION"

      - name: Write notary API key
        if: env.MACOS_NOTARIZE == 'true'
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Electron alpha app
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: pnpm --filter @legalwork/desktop build:electron

      - name: Package Electron alpha (macOS, signed + notarized)
        if: env.MACOS_NOTARIZE == 'true'
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: true
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --mac \
            --arm64 \
            --publish never

      - name: Package Electron alpha (macOS, ad-hoc signed)
        if: env.MACOS_NOTARIZE != 'true'
        env:
          # No Apple cert/notary secrets -> ad-hoc sign (mac.identity=-) so
          # Gatekeeper shows "developer cannot be verified -> Open Anyway"
          # instead of "damaged". disable-library-validation is already set in
          # build/entitlements.mac.plist, so the hardened runtime can stay on.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          echo "MACOS_NOTARIZE != 'true' -> ad-hoc signing macOS arm64 alpha."
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            -c.mac.identity=- \
            --mac \
            --arm64 \
            --publish never

      - name: Create immutable alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          body="Rolling alpha build for LegalWork (macOS arm64) from ${GITHUB_SHA}."
          if gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Alpha prerelease $ALPHA_RUN_RELEASE_TAG already exists; reusing it."
            exit 0
          fi
          gh release create "$ALPHA_RUN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LegalWork Alpha ${ALPHA_VERSION}" \
            --notes "$body" \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Upload Electron alpha updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest-mac.yml
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Electron alpha assets found in apps/desktop/dist-electron" >&2
            exit 1
          fi
          gh release upload "$ALPHA_RUN_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Update alpha updater pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          POINTER_MANIFEST="$RUNNER_TEMP/latest-mac.yml"
          export POINTER_MANIFEST
          node <<'NODE'
          const fs = require("node:fs");
          const manifestPath = "apps/desktop/dist-electron/latest-mac.yml";
          const releaseTag = process.env.ALPHA_RUN_RELEASE_TAG;
          const baseUrl = `https://github.com/eigenweltlabs/legalwork/releases/download/${releaseTag}`;
          const rewritten = fs.readFileSync(manifestPath, "utf8")
            .replace(/(url:\s*)(legalwork-[^\n]+)/g, `$1${baseUrl}/$2`)
            .replace(/(path:\s*)(legalwork-[^\n]+)/g, `$1${baseUrl}/$2`);
          fs.writeFileSync(process.env.POINTER_MANIFEST, rewritten);
          NODE

          if ! gh release view "$ALPHA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ALPHA_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ALPHA_RELEASE_NAME" \
              --notes "Stable Electron updater pointer for the newest macOS arm64 alpha prerelease." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

          gh release upload "$ALPHA_RELEASE_TAG" "$POINTER_MANIFEST#latest-mac.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
