name: Build reviewed OpenCode engine for platform acceptance
on:
  workflow_call:
    inputs:
      ref:
        description: Exact reviewed source ref; defaults to the caller's commit
        type: string
        default: ''
      build-mode:
        description: Explicit development or production source build intent
        type: string
        required: true
      build-workers:
        description: Independent source build workers (one permits a serial benchmark)
        type: number
        default: 2
      force-production-rebuild:
        description: Bypass production artifact reuse for an explicit cold comparison
        type: boolean
        default: false
      require-production-cache-hit:
        description: Fail a nonpublishing benchmark rather than silently recompiling
        type: boolean
        default: false
      reuse-run-id:
        description: Optional original same-repository Actions producer run
        type: string
        default: ''
      reuse-manifest-sha256:
        description: Independent digest required with reuse-run-id
        type: string
        default: ''
    secrets:
      APPLE_CODESIGN_CERT_P12_BASE64:
        required: false
      APPLE_CODESIGN_CERT_PASSWORD:
        required: false
    outputs:
      artifact-run-id:
        description: Verified original or current producer containing all delivery artifacts
        value: ${{ jobs.build.outputs.artifact-run-id }}
      manifest-sha256:
        description: Independent digest of the complete derivative distribution
        value: ${{ jobs.build.outputs.manifest-sha256 }}
      production-cache-hit:
        description: Exact retained production artifact was verified instead of compiled
        value: ${{ jobs.build.outputs.production-cache-hit }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ${{ inputs.reuse-run-id != '' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 90
    outputs:
      artifact-run-id: ${{ steps.handoff.outputs.run-id }}
      manifest-sha256: ${{ steps.production-verified.outputs.manifest-sha256 || steps.verified.outputs.manifest-sha256 || steps.engine.outputs.manifest-sha256 || steps.reuse.outputs.manifest-sha256 }}
      production-cache-hit: ${{ steps.production-source.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Validate explicit producer reuse inputs
        id: mode
        env:
          BUILD_MODE: ${{ inputs.build-mode }}
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REPOSITORY: ${{ github.repository }}
          REUSE_RUN_ID: ${{ inputs.reuse-run-id }}
          REUSE_MANIFEST_SHA256: ${{ inputs.reuse-manifest-sha256 }}
          FORCE_PRODUCTION_REBUILD: ${{ inputs.force-production-rebuild }}
          REQUIRE_PRODUCTION_CACHE_HIT: ${{ inputs.require-production-cache-hit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.ok(['development', 'production'].includes(process.env.BUILD_MODE), 'An explicit development or production build-mode is required');
          if (process.env.BUILD_MODE === 'production') {
            assert.equal(process.env.BUILD_REPOSITORY, 'eigenweltlabs/legalwork');
            assert.ok(['push', 'release', 'workflow_dispatch'].includes(process.env.BUILD_EVENT), 'Production signing requires a release or explicit trusted repository build');
            assert.ok(!process.env.REUSE_RUN_ID && !process.env.REUSE_MANIFEST_SHA256, 'Production cannot use manually supplied development candidate reuse');
          }
          assert.ok(!(process.env.FORCE_PRODUCTION_REBUILD === 'true' && process.env.REQUIRE_PRODUCTION_CACHE_HIT === 'true'), 'A forced rebuild cannot require a cache hit');
          if (process.env.FORCE_PRODUCTION_REBUILD === 'true' || process.env.REQUIRE_PRODUCTION_CACHE_HIT === 'true') assert.equal(process.env.BUILD_MODE, 'production');
          NODE
          node scripts/ci/reuse-opencode-derivative.mjs inputs
      - name: Identify the exact production engine inputs
        if: inputs.build-mode == 'production'
        id: production-key
        run: node scripts/ci/production-opencode-cache.mjs key
      - name: Find a trusted exact production engine artifact
        if: inputs.build-mode == 'production'
        id: production-source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_KEY: ${{ steps.production-key.outputs.key }}
          FORCE_REBUILD: ${{ inputs.force-production-rebuild }}
          REQUIRE_CACHE_HIT: ${{ inputs.require-production-cache-hit }}
          PRODUCTION_CACHE_LOOKUP: ${{ runner.temp }}/opencode-production-cache-lookup.json
        run: node scripts/ci/production-opencode-cache.mjs find
      - name: Download the independently pinned production engine cache
        if: inputs.build-mode == 'production' && steps.production-source.outputs.cache-hit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.production-key.outputs.key }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.production-source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/opencode-derivative/distribution
      - name: Import the existing production identity into a temporary keychain
        if: inputs.build-mode == 'production' && steps.production-source.outputs.cache-hit != 'true'
        id: identity
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$APPLE_CODESIGN_CERT_P12_BASE64"
          test -n "$APPLE_CODESIGN_CERT_PASSWORD"
          umask 077
          directory="$RUNNER_TEMP/opencode-derivative-signing"
          mkdir "$directory"
          certificate="$directory/identity.p12"
          keychain="$directory/identity.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$password"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_CODESIGN_CERT_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F '5ECCDBC844B673D12B8528F6B8EA5F41F6D4E4A6'
          node scripts/ci/mac-engine-signing-acceptance.mjs keychain-register "$keychain" "$RUNNER_TEMP/opencode-derivative-search-list.json"
          node scripts/ci/mac-engine-signing-acceptance.mjs policy "$keychain" "$directory/public-policy.json"
          echo "policy=$directory/public-policy.json" >> "$GITHUB_OUTPUT"
      - name: Verify the exact production signing context before compilation
        if: inputs.build-mode == 'production' && steps.production-source.outputs.cache-hit != 'true'
        run: node scripts/ci/mac-engine-signing-acceptance.mjs identity-probe "${{ steps.identity.outputs.policy }}" "$RUNNER_TEMP/opencode-derivative-identity-probe"
      - name: Download the original producer's same-repository artifact
        if: steps.mode.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/opencode-derivative/distribution
      - name: Verify current recipe, independent manifest and every archive
        if: steps.mode.outputs.reuse == 'true'
        id: reuse
        env:
          MANIFEST_SHA256: ${{ inputs.reuse-manifest-sha256 }}
          REUSE_RUN_ID: ${{ inputs.reuse-run-id }}
        run: node scripts/ci/reuse-opencode-derivative.mjs verify "$RUNNER_TEMP/opencode-derivative/distribution" "$MANIFEST_SHA256"
      - name: Identify the exact development build inputs
        if: inputs.build-mode == 'development' && steps.mode.outputs.reuse != 'true'
        id: cache-key
        run: node scripts/ci/cache-opencode-derivative.mjs key
      - name: Restore the exact development engine build
        if: inputs.build-mode == 'development' && steps.mode.outputs.reuse != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/opencode-derivative/distribution
          key: ${{ steps.cache-key.outputs.key }}
      - name: Find an exact same-PR producer after development cache eviction
        id: artifact-source
        if: inputs.build-mode == 'development' && steps.mode.outputs.reuse != 'true' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.build-mode }}
          EXPECTED_KEY: ${{ steps.cache-key.outputs.key }}
        run: node scripts/ci/recover-opencode-artifact.mjs find
      - name: Download the retained development producer artifact
        if: inputs.build-mode == 'development' && steps.artifact-source.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/opencode-derivative/distribution
      - name: Check the recovered manifest against the independent producer log
        if: inputs.build-mode == 'development' && steps.artifact-source.outputs.run-id != ''
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.artifact-source.outputs.manifest-sha256 }}
        run: node scripts/ci/recover-opencode-artifact.mjs verify-pin "$RUNNER_TEMP/opencode-derivative/distribution"
      - name: Find an existing engine from the unchanged PR base
        if: inputs.build-mode == 'development' && steps.mode.outputs.reuse != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.artifact-source.outputs.run-id == ''
        id: base-producer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/cache-opencode-derivative.mjs base-producer
      - name: Download the exact base commit's engine without recompiling
        if: steps.base-producer.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          repository: ${{ github.repository }}
          run-id: ${{ steps.base-producer.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/opencode-derivative/distribution
      - name: Compile exact reviewed source and complete twelve-target distribution
        if: steps.mode.outputs.reuse != 'true' && ((inputs.build-mode == 'production' && steps.production-source.outputs.cache-hit != 'true') || (inputs.build-mode == 'development' && steps.cache.outputs.cache-hit != 'true' && steps.artifact-source.outputs.run-id == '' && steps.base-producer.outputs.run-id == ''))
        id: engine
        env:
          BUILD_MODE: ${{ inputs.build-mode }}
          SIGNING_POLICY: ${{ steps.identity.outputs.policy }}
          BUILD_WORKERS: ${{ inputs.build-workers }}
        run: |
          arguments=("$RUNNER_TEMP/opencode-derivative" --mode "$BUILD_MODE" --workers "$BUILD_WORKERS")
          if [ "$BUILD_MODE" = production ]; then arguments+=(--mac-signing-config "$SIGNING_POLICY"); fi
          node scripts/ci/build-opencode-derivative.mjs "${arguments[@]}"
      - name: Verify all production archives and signatures against current source policy
        if: inputs.build-mode == 'production'
        id: production-verified
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.production-source.outputs.manifest-sha256 || steps.engine.outputs.manifest-sha256 }}
        run: node scripts/ci/production-opencode-cache.mjs verify "$RUNNER_TEMP/opencode-derivative/distribution"
      - name: Retain the verified immutable production engine cache
        if: inputs.build-mode == 'production' && steps.production-source.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.production-key.outputs.key }}
          path: ${{ runner.temp }}/opencode-derivative/distribution/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Select verified engine delivery without duplicate uploads
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SOURCE_RUN: ${{ steps.production-source.outputs.run-id }}
          VERIFIED_MANIFEST_SHA256: ${{ steps.production-verified.outputs.manifest-sha256 }}
        run: node scripts/ci/production-engine-handoff.mjs
      - name: Verify all development archives against current source policy
        if: inputs.build-mode == 'development' && steps.mode.outputs.reuse != 'true'
        id: verified
        run: node scripts/ci/cache-opencode-derivative.mjs verify "$RUNNER_TEMP/opencode-derivative/distribution"
      - name: Save the verified development build
        if: inputs.build-mode == 'development' && steps.mode.outputs.reuse != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/opencode-derivative/distribution
          key: ${{ steps.cache-key.outputs.key }}
      - name: Remove owned production signing material
        if: always() && inputs.build-mode == 'production' && steps.identity.outcome != 'skipped'
        shell: bash
        run: |
          directory="$RUNNER_TEMP/opencode-derivative-signing"
          if [ -f "$directory/identity.keychain-db" ]; then security delete-keychain "$directory/identity.keychain-db"; fi
          node scripts/ci/mac-engine-signing-acceptance.mjs keychain-removed "$directory/identity.keychain-db" "$RUNNER_TEMP/opencode-derivative-keychain-cleanup.json"
          rm -f "$directory/identity.p12"
      - name: Retain complete build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-derivative-build-receipts
          path: |
            ${{ runner.temp }}/opencode-derivative/build-*/build-evidence/
            ${{ runner.temp }}/opencode-derivative/build-*/artifact/provenance.json
            ${{ runner.temp }}/opencode-derivative/build-*/result.json
            ${{ runner.temp }}/opencode-derivative/builds.json
            ${{ runner.temp }}/opencode-derivative/reuse-receipt.json
            ${{ runner.temp }}/opencode-derivative-search-list.json
            ${{ runner.temp }}/opencode-derivative-identity-probe/
            ${{ runner.temp }}/opencode-derivative-keychain-cleanup.json
            ${{ runner.temp }}/ci-spans.jsonl
            ${{ runner.temp }}/opencode-production-cache-lookup.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.handoff.outputs.reuse != 'true'
        with:
          name: opencode-derivative-ci
          path: ${{ runner.temp }}/opencode-derivative/distribution/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain verified macOS engine archives
        if: steps.handoff.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-derivative-ci-macOS
          path: |
            ${{ runner.temp }}/opencode-derivative/distribution/derivative-release.json
            ${{ runner.temp }}/opencode-derivative/distribution/distribution-receipt.json
            ${{ runner.temp }}/opencode-derivative/distribution/archives/*-darwin-*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain verified Linux engine archives
        if: steps.handoff.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-derivative-ci-Linux
          path: |
            ${{ runner.temp }}/opencode-derivative/distribution/derivative-release.json
            ${{ runner.temp }}/opencode-derivative/distribution/distribution-receipt.json
            ${{ runner.temp }}/opencode-derivative/distribution/archives/*-linux-*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain verified Windows engine archives
        if: steps.handoff.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-derivative-ci-Windows
          path: |
            ${{ runner.temp }}/opencode-derivative/distribution/derivative-release.json
            ${{ runner.temp }}/opencode-derivative/distribution/distribution-receipt.json
            ${{ runner.temp }}/opencode-derivative/distribution/archives/*-windows-*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
