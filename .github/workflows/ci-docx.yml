name: DOCX interoperability
on:
  pull_request:
    branches: [dev, codex/projects-akte-workspace, codex/opencode-v2-migration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docx: ${{ steps.scope.outputs.docx }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope
  docx:
    needs: changes
    if: needs.changes.outputs.docx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      # The suite loads docx-export.ts, which imports the app's "@/" alias.
      # Bun resolves it the way every other test suite here does; plain node
      # does not.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @legalwork/app exec bun test tests/docx-document-state.test.ts tests/docx-roundtrip.test.ts tests/docx-table-grid.test.ts
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
      - run: pnpm --filter @legalwork/app exec node scripts/docx-interop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-interop-evidence
          path: apps/app/docx-interop-output/
